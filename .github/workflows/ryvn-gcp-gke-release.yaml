name: Build & Release gcp-gke

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "gcp/gke/**"
      - ".github/workflows/ryvn-gcp-gke-release.yaml"
  pull_request:
    paths:
      - "gcp/gke/**"
      - ".github/workflows/ryvn-gcp-gke-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: gcp-gke
    permissions:
      contents: write
      id-token: write
    secrets:
      RYVN_CLIENT_ID: ${{ secrets.RYVN_CLIENT_ID }}
      RYVN_CLIENT_SECRET: ${{ secrets.RYVN_CLIENT_SECRET }}
