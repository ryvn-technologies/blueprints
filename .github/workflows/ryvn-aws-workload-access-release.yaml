name: Build & Release aws-workload-access

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "aws/workload-identity/**"
      - ".github/workflows/ryvn-aws-workload-access-release.yaml"
  pull_request:
    paths:
      - "aws/workload-identity/**"
      - ".github/workflows/ryvn-aws-workload-access-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: aws-workload-access
    permissions:
      contents: write
      id-token: write
