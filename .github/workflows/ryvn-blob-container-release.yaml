name: Build & Release blob-container

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "azure/blob-container/**"
      - ".github/workflows/ryvn-blob-container-release.yaml"
  pull_request:
    paths:
      - "azure/blob-container/**"
      - ".github/workflows/ryvn-blob-container-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: blob-container
    permissions:
      contents: write
      id-token: write
    secrets:
      RYVN_CLIENT_ID: ${{ secrets.RYVN_CLIENT_ID }}
      RYVN_CLIENT_SECRET: ${{ secrets.RYVN_CLIENT_SECRET }}
