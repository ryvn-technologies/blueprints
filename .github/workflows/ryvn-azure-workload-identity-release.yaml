name: Build & Release azure-workload-identity

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "azure/workload-identity/**"
      - ".github/workflows/ryvn-azure-workload-identity-release.yaml"
  pull_request:
    paths:
      - "azure/workload-identity/**"
      - ".github/workflows/ryvn-azure-workload-identity-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: azure-workload-identity
      tag_prefix: azure-workload-identity@
    permissions:
      contents: write
      id-token: write
