name: Build & Release ecr-registry

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "aws/ecr-registry/**"
      - ".github/workflows/ryvn-ecr-registry-release.yaml"
  pull_request:
    paths:
      - "aws/ecr-registry/**"
      - ".github/workflows/ryvn-ecr-registry-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: ecr-registry
    permissions:
      contents: write
      id-token: write
