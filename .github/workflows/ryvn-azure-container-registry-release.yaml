name: Build & Release azure-container-registry

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "azure/azure-container-registry/**"
      - ".github/workflows/ryvn-azure-container-registry-release.yaml"
  pull_request:
    paths:
      - "azure/azure-container-registry/**"
      - ".github/workflows/ryvn-azure-container-registry-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: azure-container-registry
    permissions:
      contents: write
      id-token: write
