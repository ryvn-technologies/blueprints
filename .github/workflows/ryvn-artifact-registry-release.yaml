name: Build & Release artifact-registry

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "gcp/artifact-registry/**"
      - ".github/workflows/ryvn-artifact-registry-release.yaml"
  pull_request:
    paths:
      - "gcp/artifact-registry/**"
      - ".github/workflows/ryvn-artifact-registry-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: artifact-registry
    permissions:
      contents: write
      id-token: write
