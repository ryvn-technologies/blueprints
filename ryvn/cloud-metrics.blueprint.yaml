# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: cloud-metrics
spec:
  description: |
    Scrape pipeline for cloud datastore metrics. Installing this blueprint
    is the explicit opt-in: it owns a dedicated ryvn-collector release, the
    reader identity, and the rendered allowlist fragment through the normal
    blueprint lifecycle — collection starts only after the reader binding
    lands on the dedicated collector. A datastore installation emitting the
    `cloud_metrics` output declares collectable resources; it never
    installs or enables this blueprint by itself — Ryvn modules emit it by
    default and foreign Terraform modules can emit the same shape to opt
    in.

    One blueprint covers every provider: each child is conditioned on the
    environment's provider, so an installation materializes only the
    identity + collector pair for the cloud it runs on.

    On AWS the identity composes two shared modules: the reader child
    renders the read-only CloudWatch/RDS/tag policy, and the identity
    child binds it to the dedicated collector's ServiceAccount through
    aws-workload-identity via an EKS Pod Identity association. The
    collector child runs the same ryvn-collector chart as the platform
    install with the core pipelines off — no duplicate scrapes — and its
    own ServiceAccount. The rendered allowlist — the tag-gated YACE
    discovery fragment the hub's reconcile writes as blueprint inputs —
    lands on the collector release itself: the chart carries it in its own
    release-owned ConfigMap. Both tag (`ryvn.app/cloud-metrics=<environment-id>`)
    and allowlist must admit a resource before its series reach Mimir.
  displayName: Cloud Metrics
  inputs:
    # Hub-managed: the cloud-metrics ensure runnable upserts the rendered
    # allowlist fragment here and reconciles, so blueprint updates never fight
    # the value it owns. Hidden because it is not a user-facing setting.
    - name: configAlloy
      type: string
      default: ""
      description: Rendered discovery fragment the collector's own ConfigMap carries. Managed by the hub — do not edit by hand.
      hidden: true
    # Hub-managed: the render's union of monitored scope ids across
    # admitted targets — GCP project ids / Azure subscription ids the
    # identity child's reader bindings cover, so reads are confined to
    # exactly the scopes the environment declared.
    - name: monitoredIds
      type: array
      default: []
      description: Provider scope ids (GCP projects, Azure subscriptions) the identity child grants read on. Managed by the hub — do not edit by hand.
      hidden: true
    # User-owned collection policy (native-collection design): keyed by
    # provider, then family. Omitted or {} resolves to the reviewed
    # defaults for every supported family (aws: rds, elasticache; gcp:
    # cloudsql, memorystore; azure:
    # microsoft.dbforpostgresql/flexibleservers, microsoft.cache/redis,
    # microsoft.cache/redisenterprise); a
    # family's nonempty `metrics` list replaces its defaults exactly —
    # AWS entries are CloudWatch {name, statistics} pairs, GCP entries
    # are full exact metric types like
    # cloudsql.googleapis.com/database/cpu/utilization, Azure entries are
    # Azure Monitor {name, aggregations} pairs (Azure
    # entries may also list exact `dimensions`, which is rejected
    # visibly — dimension-value fan-out is indeterminate and the
    # exporter cannot bound it; the InstanceId baseline on Managed
    # Redis expands via wildcard as a documented accepted residual),
    # and a metric
    # absent from the defaults needs no Ryvn-side mapping — while
    # `metrics: []` disables the family's provider-metric collection
    # without hiding its declarations. The whole value replaces on write;
    # nothing merges. Server-side validation rejects unknown providers,
    # families, fields and statistics/aggregations with the input path.
    - name: collection
      type: map
      default: {}
      displayName: Cloud metric selection
      description: Provider-specific metric selection for this environment. Explicit family lists replace recommended defaults; an empty metrics list disables a family.
  installations:
    # Collector topology invariants — changing any of these changes the
    # security or cost shape of the install; do so deliberately, not in a
    # passing yaml edit:
    #   - the collector runs as a single-replica Deployment, never the
    #     platform collector's per-node DaemonSet (an N-pod footprint
    #     multiplies Cloud API reads with no benefit — no node-local
    #     scrapes exist);
    #   - the collector's serviceUser declares `role: collector` — an
    #     omitted role mints an org-wide admin binding in the env;
    #   - the collector `dependencies`-orders after the identity child so
    #     the reader binding exists before it scrapes with it;
    #   - the generated config lands on the collector release's own
    #     ConfigMap (release-owned, ryvn-cloud-metrics-alloy-config),
    #     never the platform release's ryvn-alloy-config;
    #   - every client-secret serviceUser in a blueprint declares an
    #     explicit role for the same reason.
    # Read-only reader policy (aws-cloud-metrics-identity): CloudWatch metric
    # reads and tag:GetResources — nothing else.
    - service: aws-cloud-metrics-identity
      name: '{{ ParentInstallationName }}-reader'
      alias: aws-reader
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "aws" }}'
      config: |
        aws_region: '{{ .ryvn.env.state.cluster_region }}'
        name_prefix: '{{ .ryvn.env.name }}'
        environment: '{{ .ryvn.env.name }}'
    # Dedicated reader identity on the shared aws-workload-identity module:
    # the reader policy attaches to a role bound to the dedicated collector's
    # ServiceAccount via an EKS Pod Identity association.
    - service: aws-workload-identity
      name: '{{ ParentInstallationName }}-identity'
      alias: aws-identity
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "aws" }}'
      config: |
        aws_region: '{{ .ryvn.env.state.cluster_region }}'
        eks_cluster_name: '{{ .ryvn.env.state.cluster_name }}'
        name_prefix: '{{ .ryvn.env.name }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          cloud_metrics:
            associations:
              collector:
                namespace: observability
                service_account: ryvn-cloud-metrics-alloy
            policy_arns:
              reader: '{{ (serviceInstallation "aws-reader").outputs.policy_arn }}'
    # GCP needs no reader policy module: roles/monitoring.viewer binds
    # directly on each declared project.
    - service: gcp-workload-identity
      name: '{{ ParentInstallationName }}-identity'
      alias: gcp-identity
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        project_id: '{{ .ryvn.env.provider.gcp.projectId }}'
        name_prefix: '{{ .ryvn.env.name }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          cloud_metrics:
            associations:
              collector:
                namespace: observability
                service_account: ryvn-cloud-metrics-alloy
            {{- if (input "monitoredIds") }}
            project_roles:
              {{- range $pid := input "monitoredIds" }}
              {{ $pid | toJson }}:
                role: roles/monitoring.viewer
                project: {{ $pid | toJson }}
              {{- end }}
            {{- end }}
    # Azure Workload Identity needs a managed identity + role
    # assignments rather than a policy doc, so the azure identity child
    # is the shared azure-workload-identity module directly — Monitoring
    # Reader bound per declared subscription (same monitoredIds seam).
    - service: azure-workload-identity
      name: '{{ ParentInstallationName }}-identity'
      alias: azure-identity
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "azure" }}'
      config: |
        location: '{{ .ryvn.env.state.resource_group.location }}'
        resource_group_name: '{{ .ryvn.env.state.resource_group.name }}'
        oidc_issuer_url: '{{ .ryvn.env.state.cluster.oidc_issuer_url }}'
        name_prefix: '{{ .ryvn.env.name }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          cloud_metrics:
            associations:
              collector:
                namespace: observability
                service_account: ryvn-cloud-metrics-alloy
            {{- if (input "monitoredIds") }}
            role_assignments:
              {{- range $sid := input "monitoredIds" }}
              monitored_{{ $sid }}:
                scope: /subscriptions/{{ $sid }}
                role_definition_name: Monitoring Reader
              {{- end }}
            {{- end }}
    - service: ryvn-collector
      name: '{{ ParentInstallationName }}-collector'
      alias: collector
      # Keep cloud API scrapes and their identity separate from the platform
      # collector. Provider-specific exporter config arrives via configAlloy.
      namespace: observability
      condition: '{{ or (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "azure") }}'
      config: |
        alloy:
          enabled: true
          controller:
            # Cloud API scrapes are not node-local; more replicas multiply reads.
            type: deployment
            replicas: 1
            {{- if eq EnvironmentProviderType "azure" }}
            podLabels:
              azure.workload.identity/use: "true"
            {{- end }}
          alloy:
            envFrom:
            - secretRef:
                name: '{{ k8sSecretName "ryvn-cloud-metrics-collector-client-creds" }}'
            configMap:
              create: false
              name: ryvn-cloud-metrics-alloy-config
            clustering:
              enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
          serviceAccount:
            name: ryvn-cloud-metrics-alloy
            {{- if eq EnvironmentProviderType "azure" }}
            annotations:
              azure.workload.identity/client-id: '{{ (serviceInstallation "azure-identity").outputs.client_ids.cloud_metrics }}'
              azure.workload.identity/tenant-id: '{{ (serviceInstallation "azure-identity").outputs.tenant_id }}'
            {{- end }}
        environment:
          name: "{{ .ryvn.env.name }}"
        org:
          id: "{{ .ryvn.env.orgId }}"
        features:
          collector:
            enabled: false
          podLogs:
            enabled: false
          metrics:
            enabled: false
            cloud:
              enabled: true
              # The hub renders the allowlist; the feature-local ConfigMap
              # watch reloads it on reconcile-driven upgrades.
              config:
              {{- input "configAlloy" | toYaml | nindent 16 }}
          serviceMonitors:
            enabled: false
        endpoints:
          mimir: {{ Hub "mimirUrl" | toJson }}
        defaultConnectionId: '{{ .ryvn.observability.defaultConnectionId }}'
        requiredConnectionIds: {{ .ryvn.observability.requiredConnectionIds | toJson }}
        {{- if ObservabilityDestinations }}
        destinations:
        {{- ObservabilityDestinations | toYaml | nindent 2 }}
        {{- end }}
        auth:
          tokenUrl: {{ Hub "tokenUrl" | toJson }}
          projectId: {{ Hub "projectId" | toJson }}
      releaseChannel: stable
      # AWS/GCP have no pod marker to gate on; wait for the identity explicitly.
      dependencies:
        - serviceInstallation: '{{ ParentInstallationName }}-identity'
      serviceUser:
        credentialType: client-secret
        enabled: true
        secretName: ryvn-cloud-metrics-collector-client-creds
        role: collector
  distribution: marketplace-managed
