# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: private-service-consumer
spec:
  description: |
    Connects this environment to a Private Service Publisher, so installations here can call services in the publisher's environment over a private link.

    The link runs over the cloud's private network (Private Service Connect on GCP, PrivateLink on AWS) to the internal gateway of the publisher's environment. Installations here call a service at the same internal URL it has there, like `https://<name>.<publisherDomain>`.

    ## Setup

    1. Get the `publisherId` and `publisherDomain` outputs of the Private Service Publisher you want to reach. It must be on the same cloud as this environment, and on GCP in the same region. If this environment is in another GCP project or AWS account, or in another AWS region, the publisher must allow it first.
    2. Install this blueprint with those two values, copied exactly.
    3. Check `linkState`. It shows `ACCEPTED` on GCP or `available` on AWS once the publisher accepts the connection.

    Each install connects to one publisher. To reach more, install this once per publisher.

    ## Call a service

    - Use the service's internal URL from the publisher's environment. Names under `publisherDomain` resolve to the link inside this environment, and the certificate is publicly trusted, so clients need no extra setup.
    - Every service with an internal [Route](https://ryvn.ai/docs/networking/routes) in the publisher's environment is reachable.
    - The link carries HTTP, including gRPC. It doesn't carry other protocols, like direct database connections.
    - Calls can fail for a few minutes after the link first connects, while DNS updates.

    ## What to expect

    - If `linkState` stays `PENDING` on GCP, or the install can't find the publisher on AWS, the publisher doesn't allow this environment's project, account, or region yet.
    - Uninstall this before the publisher is uninstalled or stops allowing this environment. On AWS, updating or uninstalling this fails until the publisher allows this environment again.
  displayName: Private Service Consumer
  inputs:
    - name: publisherId
      type: string
      description: The `publisherId` output of the Private Service Publisher to connect to.
      displayName: Publisher ID
    - name: publisherDomain
      type: string
      description: The `publisherDomain` output of the same publisher.
      displayName: Publisher Domain
  outputs:
    - name: consumerId
      type: string
      from: '{{ if eq EnvironmentProviderType "aws" }}{{ (serviceInstallation "link").outputs.vpc_endpoint_id }}{{ else }}{{ (serviceInstallation "link").outputs.consumer_id }}{{ end }}'
      description: Endpoint this environment connects through.
      displayName: Consumer ID
    - name: linkState
      type: string
      from: '{{ if eq EnvironmentProviderType "aws" }}{{ (serviceInstallation "link").outputs.vpc_endpoint_state }}{{ else }}{{ (serviceInstallation "link").outputs.link_state }}{{ end }}'
      description: Whether the publisher accepted the connection.
      displayName: Link State
  installations:
    - service: gcp-private-service-consumer
      name: '{{ ParentInstallationName }}'
      alias: link
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        project_id: '{{ .ryvn.env.provider.gcp.projectId }}'
        network: '{{ .ryvn.env.state.vpc.self_link }}'
        subnetwork: '{{ (index .ryvn.env.state.vpc.subnets 0).id }}'
        subnetwork_region: '{{ (index .ryvn.env.state.vpc.subnets 0).region }}'
        name_prefix: '{{ ParentInstallationName }}'
        publisher_id: '{{ input "publisherId" | trim }}'
        publisher_domain: '{{ input "publisherDomain" | trim }}'
      releaseChannel: stable
    - service: aws-privatelink-endpoint
      name: '{{ ParentInstallationName }}'
      alias: link
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "aws" }}'
      config: |
        region: '{{ .ryvn.env.state.cluster_region }}'
        vpc_id: '{{ .ryvn.env.state.vpc.id }}'
        subnet_ids: {{ .ryvn.env.state.vpc.private_subnet_ids | toJson }}
        name_prefix: '{{ ParentInstallationName }}'
        endpoint_service_name: '{{ input "publisherId" | trim }}'
        private_hosted_zone_name: '{{ input "publisherDomain" | trim }}'
      releaseChannel: stable
  distribution: marketplace-managed
