# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: rabbitmq
spec:
  description: |
    Deploys a production-ready RabbitMQ cluster, run by the official RabbitMQ operators.

    Declare the users, vhosts, queues, exchanges, bindings, and policies below; every deploy reconciles the broker to match. Services connect over AMQP using the connection outputs.
  displayName: RabbitMQ
  inputGroups:
    - name: access
      displayName: Access
      description: Public access to the management UI
    - name: credentials
      displayName: Credentials
      description: Admin account and application user
    - name: capacity
      displayName: Capacity
      description: Replicas, resources, and storage
    - name: topology
      displayName: Topology
      description: Vhosts, queues, exchanges, bindings, and policies
    - name: observability
      displayName: Observability
      description: Prometheus metrics collection
  inputs:
    - name: exposeManagementUI
      type: boolean
      default: false
      description: Publish the management UI at a public HTTPS URL, protected only by the RabbitMQ credentials. Leave off to keep it in-cluster on port 15672.
      displayName: Expose Management UI
      group: access
    - name: adminUsername
      type: string
      default: admin
      description: Username for the RabbitMQ administrator account.
      displayName: Admin Username
      group: credentials
    - name: adminPassword
      type: string
      isSecret: true
      description: Password for the administrator account. Applied on first boot; changing it later has no effect.
      displayName: Admin Password
      group: credentials
      generated:
        type: random-string
        length: 32
    - name: createAppUser
      type: boolean
      default: true
      description: Create a non-admin user for your applications, with full permissions on the vhost below and every vhost under Topology.
      displayName: Create Application User
      group: credentials
    - name: appUsername
      type: string
      default: app
      description: Username your applications authenticate with.
      displayName: Application Username
      group: credentials
      condition: '{{ input "createAppUser" }}'
    - name: appPassword
      type: string
      isSecret: true
      description: Password for the application user. Can be rotated after install.
      displayName: Application Password
      group: credentials
      condition: '{{ input "createAppUser" }}'
      generated:
        type: random-string
        length: 32
    - name: appVhost
      type: string
      default: /
      description: Vhost the application user connects to. Created if it does not exist; only list it under Vhosts to set its default queue type.
      displayName: Application Vhost
      group: credentials
      condition: '{{ input "createAppUser" }}'
    - name: size
      type: string
      default: standard
      description: CPU and memory requested by each replica. A replica that does not fit your nodes stays Pending.
      displayName: Size
      group: capacity
      options:
        - label: "Micro (100m CPU, 512Mi memory)"
          value: micro
        - label: "Small (500m CPU, 1Gi memory)"
          value: small
        - label: "Standard (1 CPU, 2Gi memory)"
          value: standard
        - label: "Large (2 CPU, 4Gi memory)"
          value: large
    - name: replicas
      type: string
      default: "3"
      description: How many RabbitMQ nodes to run. Three survives losing one; a single node has no redundancy.
      displayName: Replicas
      group: capacity
      options:
        - label: "1 replica"
          value: "1"
        - label: "3 replicas (recommended)"
          value: "3"
    - name: storageSizeGi
      type: number
      default: 30
      description: Volume size per replica, in GiB. Can be grown later, never shrunk.
      displayName: Storage Size (GiB)
      group: capacity
    - name: storageClassName
      type: string
      default: ""
      description: Storage class for the replica volumes, which sets disk type and IOPS. Empty uses the cluster default.
      displayName: Storage Class
      group: capacity
    - name: topologyAllowedNamespaces
      type: array
      default: []
      description: Other namespaces allowed to declare topology against this cluster.
      displayName: Allowed Topology Namespaces
      group: topology
    - name: vhostDefinitions
      type: string
      default: ""
      multiline: true
      displayName: Vhosts
      group: topology
      description: |
        Virtual hosts to create, as a YAML list. Each is an isolated namespace for queues and exchanges, and the application user gets access to all of them.
        ```yaml
        - name: orders
          defaultQueueType: quorum
        ```
    - name: queueDefinitions
      type: string
      default: ""
      multiline: true
      displayName: Queues
      group: topology
      description: |
        Queues to create, as a YAML list. Quorum queues replicate across nodes; classic queues live on one. Omit `vhost` to use `/`.
        ```yaml
        - name: order.events
          vhost: /
          type: quorum
          durable: true
        ```
    - name: exchangeDefinitions
      type: string
      default: ""
      multiline: true
      displayName: Exchanges
      group: topology
      description: |
        Exchanges to create, as a YAML list. `type` is `direct`, `topic`, `fanout`, or `headers`, and cannot be changed later.
        ```yaml
        - name: events
          type: topic
          durable: true
        ```
    - name: bindingDefinitions
      type: string
      default: ""
      multiline: true
      displayName: Bindings
      group: topology
      description: |
        Routes from an exchange to a queue or another exchange, as a YAML list. Source and destination must exist in the same vhost.
        ```yaml
        - source: events
          destination: order.events
          destinationType: queue
          routingKey: "order.#"
        ```
    - name: policyDefinitions
      type: string
      default: ""
      multiline: true
      displayName: Policies
      group: topology
      description: |
        Policies applied to queues or exchanges matching a name pattern, as a YAML list. Sets message TTLs, length limits, and dead-lettering; highest-priority match wins.
        ```yaml
        - name: order-events-ttl
          pattern: "^order\\."
          applyTo: queues
          definition:
            message-ttl: 86400000
            max-length: 1000000
        ```
    - name: enableMetrics
      type: boolean
      default: false
      description: Scrape queue depth, message rates, and node health into dashboards and alerts.
      displayName: Enable Metrics
      group: observability
  installations:
    - service: rabbitmq-cluster-operator
      namespace: rabbitmq-system
      releaseChannel: stable
      config: |
        {}
    - service: rabbitmq-topology-operator
      namespace: rabbitmq-system
      releaseChannel: stable
      config: |
        {}
    - service: rabbitmq
      namespace: rabbitmq
      releaseChannel: stable
      secrets:
        - name: rabbitmq-admin
          values:
            - key: username
              valueFromInput:
                name: adminUsername
            - key: password
              valueFromInput:
                name: adminPassword
        - name: rabbitmq-app-user
          values:
            - key: username
              valueFromInput:
                name: appUsername
            - key: password
              valueFromInput:
                name: appPassword
      config: |
        cluster:
          replicas: {{ input "replicas" }}
          persistence:
            storage: '{{ input "storageSizeGi" }}Gi'
            storageClassName: '{{ input "storageClassName" }}'
          topologyAllowedNamespaces:
        {{- if gt (len (input "topologyAllowedNamespaces")) 0 }}
        {{ input "topologyAllowedNamespaces" | toYaml | nindent 12 }}
        {{- else }}
            []
        {{- end }}
        {{- if eq (input "size") "micro" }}
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
        {{- else if eq (input "size") "small" }}
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
        {{- else if eq (input "size") "standard" }}
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 2Gi
        {{- else if eq (input "size") "large" }}
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 4Gi
        {{- end }}
        auth:
          admin:
            username: '{{ k8sSecretValue "rabbitmq-admin" "username" }}'
            password: '{{ k8sSecretValue "rabbitmq-admin" "password" }}'
          appUser:
            enabled: {{ input "createAppUser" }}
            username: '{{ input "appUsername" }}'
            password: '{{ k8sSecretValue "rabbitmq-app-user" "password" }}'
            vhost: '{{ input "appVhost" }}'
        metrics:
          enabled: {{ input "enableMetrics" }}
        topologyOperator:
          eventRBAC:
            enabled: true
            namespace: rabbitmq-system
            serviceAccountName: messaging-topology-operator
        managementIngress:
          enabled: {{ input "exposeManagementUI" }}
          className: external-nginx
          annotations:
            cert-manager.io/cluster-issuer: external-issuer
          host: '{{ .ryvn.installation.name }}.{{ .ryvn.env.state.public_domain.name }}'
          tls:
            - secretName: '{{ .ryvn.installation.name }}-tls'
              hosts:
                - '{{ .ryvn.installation.name }}.{{ .ryvn.env.state.public_domain.name }}'
        topology:
        {{- if input "vhostDefinitions" | trim }}
          vhosts: |
        {{ input "vhostDefinitions" | nindent 12 }}
        {{- else }}
          vhosts: ""
        {{- end }}
        {{- if input "queueDefinitions" | trim }}
          queues: |
        {{ input "queueDefinitions" | nindent 12 }}
        {{- else }}
          queues: ""
        {{- end }}
        {{- if input "exchangeDefinitions" | trim }}
          exchanges: |
        {{ input "exchangeDefinitions" | nindent 12 }}
        {{- else }}
          exchanges: ""
        {{- end }}
        {{- if input "bindingDefinitions" | trim }}
          bindings: |
        {{ input "bindingDefinitions" | nindent 12 }}
        {{- else }}
          bindings: ""
        {{- end }}
        {{- if input "policyDefinitions" | trim }}
          policies: |
        {{ input "policyDefinitions" | nindent 12 }}
        {{- else }}
          policies: ""
        {{- end }}
  outputs:
    - name: adminUsername
      type: string
      displayName: Admin Username
      description: Username for the RabbitMQ admin account.
      from: '{{ input "adminUsername" }}'
    - name: adminCredentialsSecretName
      type: string
      displayName: Admin Credentials Secret
      description: Kubernetes Secret containing the admin username and password.
      from: '{{ k8sSecretName "rabbitmq-admin" }}'
    - name: appUsername
      type: string
      displayName: Initial Username
      description: Username for the initial RabbitMQ user.
      from: '{{ input "appUsername" }}'
      condition: '{{ input "createAppUser" }}'
    - name: appCredentialsSecretName
      type: string
      displayName: Initial User Credentials Secret
      description: Kubernetes Secret containing the initial RabbitMQ user credentials.
      from: '{{ k8sSecretName "rabbitmq-app-user" }}'
      condition: '{{ input "createAppUser" }}'
    - name: appVhost
      type: string
      displayName: Initial User Vhost
      description: Primary virtual host for the initial RabbitMQ user.
      from: '{{ input "appVhost" }}'
      condition: '{{ input "createAppUser" }}'
    - name: host
      type: string
      displayName: Host
      description: Internal hostname for AMQP connections.
      from: '{{ (serviceInstallation "rabbitmq").name }}.{{ (serviceInstallation "rabbitmq").namespace }}.svc.cluster.local'
    - name: amqpPort
      type: string
      displayName: AMQP Port
      description: AMQP protocol port.
      from: "5672"
    - name: managementPort
      type: string
      displayName: Management Port
      description: RabbitMQ management UI port.
      from: "15672"
  distribution: marketplace-unmanaged
