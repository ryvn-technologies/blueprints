# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: tailscale-operator
spec:
  description: |
    Deploys the Tailscale Kubernetes operator with OIDC workload identity or an OAuth client secret. The operator registers services in your Tailnet, enabling private access to databases, caches, and other cluster resources from devices on your Tailnet.

    Prerequisites: configure Tailscale access controls and create an OIDC trust credential or OAuth client. For OIDC, the cluster's service account issuer must be publicly accessible. See the [operator installation guide](https://tailscale.com/docs/kubernetes-operator/install-operator) and [workload identity guide](https://tailscale.com/docs/kubernetes-operator/manage-and-configure/workload-identity-federation).
  displayName: Tailscale Operator
  inputGroups:
    - name: authentication
      displayName: Authentication
      description: Identity used by the Tailscale operator.
    - name: externalHosts
      displayName: External Hosts
      description: Expose databases and other endpoints that Ryvn does not manage.
  inputs:
    - name: authMethod
      type: string
      default: oauth
      displayName: Authentication Method
      description: Use the operator's Kubernetes service account token or an OAuth client secret.
      group: authentication
      options:
        - label: OIDC workload identity
          value: oidc
        - label: OAuth client secret
          value: oauth
    - name: oidcClientId
      type: string
      displayName: OIDC Client ID
      description: Client ID generated by the Tailscale OIDC trust credential.
      group: authentication
      condition: '{{ eq (input "authMethod") "oidc" }}'
    - name: oidcAudience
      type: string
      displayName: OIDC Audience
      description: Audience generated by the Tailscale OIDC trust credential.
      group: authentication
      condition: '{{ eq (input "authMethod") "oidc" }}'
    - name: clientId
      type: string
      isSecret: true
      displayName: Client ID
      description: Tailscale OAuth client ID.
      group: authentication
      condition: '{{ eq (input "authMethod") "oauth" }}'
    - name: clientSecret
      type: string
      isSecret: true
      displayName: Client Secret
      description: Tailscale OAuth client secret.
      group: authentication
      condition: '{{ eq (input "authMethod") "oauth" }}'
    - name: externalHosts
      type: map
      default: {}
      displayName: External Hosts
      description: |
        Hosts outside the cluster to expose on your Tailnet as `<name>-<environment>`. The host must be reachable from the environment's VPC.

        Example: `analytics` → `mydb.abc123.us-east-1.rds.amazonaws.com` is reachable as `analytics-prod`.
      group: externalHosts
  installations:
    - service: tailscale-operator
      namespace: tailscale-operator
      releaseChannel: stable
      condition: '{{ eq (input "authMethod") "oidc" }}'
      config: |
        installCRDs: true
        oauth:
          clientId: '{{ input "oidcClientId" }}'
          audience: '{{ input "oidcAudience" }}'
    - service: tailscale-operator
      namespace: tailscale-operator
      releaseChannel: stable
      condition: '{{ eq (input "authMethod") "oauth" }}'
      secrets:
        - name: operator-oauth
          values:
            - key: client_id
              valueFromInput: clientId
            - key: client_secret
              valueFromInput: clientSecret
      config: |
        installCRDs: true
        oauthSecretVolume:
          secret:
            secretName: '{{ k8sSecretName "operator-oauth" }}'
            items:
              - key: client_id
                path: client_id
              - key: client_secret
                path: client_secret
    - service: tailscale-resources
      name: '{{ ParentInstallationName }}-ext'
      namespace: tailscale-operator
      releaseChannel: stable
      config: |
        externalServices:
          {{- if input "externalHosts" }}
          {{- range $name, $host := input "externalHosts" }}
          - name: '{{ ParentInstallationName }}-{{ $name }}'
            externalName: '{{ $host }}'
            annotations:
              tailscale.com/hostname: '{{ $name }}-{{ EnvironmentName }}'
            labels:
              ryvn.app/blueprint: tailscale-operator
              ryvn.app/exposed-service: '{{ $name }}'
          {{- end }}
          {{- else }}
          []
          {{- end }}
  outputs:
    - name: namespace
      type: string
      displayName: Namespace
      description: Kubernetes namespace where the operator is deployed.
      from: tailscale-operator
  distribution: marketplace-unmanaged
