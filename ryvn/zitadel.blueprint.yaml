# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: zitadel
spec:
  displayName: ZITADEL
  description: >
    Deploys a dedicated ZITADEL instance and applies Ryvn's declarative identity
    configuration. The Helm FirstInstance machine credential owns the Terraform
    state; runtime application and service-account credentials are exposed as
    blueprint outputs for the rest of the control-plane stack.
  inputGroups:
    - name: endpoint
      displayName: Endpoint
      description: Public ZITADEL endpoint.
    - name: database
      displayName: Database
      description: >
        PostgreSQL instance supplied by the BYOC database installation. The init job
        uses the admin role to create the zitadel database and user on it.
    - name: applications
      displayName: Application URLs
      description: Public dashboard and Grafana endpoints.
    - name: federation
      displayName: Ryvn operator federation
      description: Per-instance client registered in central Ryvn ZITADEL.
    - name: vendorIdentity
      displayName: Vendor identity provider
      description: Optional OIDC provider owned by the vendor, e.g. Okta. All credentials are required when enabled.
  inputs:
    - name: domain
      type: string
      displayName: Authentication Domain
      description: Public hostname for the ZITADEL issuer, without a scheme.
      group: endpoint
      immutable: true
    - name: databaseHost
      type: string
      displayName: Database Host
      description: PostgreSQL hostname reachable from the cluster.
      group: database
      immutable: true
    - name: databasePassword
      type: string
      isSecret: true
      displayName: Database Password
      description: Password for the zitadel database user created by the init job.
      group: database
      immutable: true
    - name: databaseAdminUsername
      type: string
      default: postgres
      displayName: Database Admin Username
      description: Existing role with CREATEDB and CREATEROLE, used only by the init job.
      group: database
      immutable: true
    - name: databaseAdminPassword
      type: string
      isSecret: true
      displayName: Database Admin Password
      description: Password for the database admin role.
      group: database
      immutable: true
    - name: databaseAdminDatabase
      type: string
      default: postgres
      displayName: Database Admin Database
      description: Existing database the admin role connects to before the zitadel database exists.
      group: database
      immutable: true
    - name: dashboardUrl
      type: string
      displayName: Dashboard URL
      description: Public base URL for the Ryvn dashboard and Login V2 UI.
      group: applications
    - name: grafanaUrl
      type: string
      displayName: Grafana URL
      description: Public base URL for the instance Grafana deployment.
      group: applications
    - name: operatorOidcClientId
      type: string
      displayName: Operator OIDC Client ID
      description: Client ID registered for this instance in central Ryvn ZITADEL.
      group: federation
    - name: operatorOidcClientSecret
      type: string
      isSecret: true
      displayName: Operator OIDC Client Secret
      description: Client secret registered for this instance in central Ryvn ZITADEL.
      group: federation
    - name: enableVendorIdp
      type: boolean
      default: false
      displayName: Enable Vendor IdP
      description: Create an instance-scope OIDC provider for the vendor's own identity provider.
      group: vendorIdentity
    - name: vendorIdpName
      type: string
      displayName: Vendor IdP Name
      description: Display name for the vendor-owned OIDC provider.
      group: vendorIdentity
      condition: '{{ input "enableVendorIdp" }}'
    - name: vendorIdpIssuer
      type: string
      displayName: Vendor IdP Issuer
      description: OIDC issuer for the vendor-owned identity provider.
      group: vendorIdentity
      condition: '{{ input "enableVendorIdp" }}'
    - name: vendorIdpClientId
      type: string
      displayName: Vendor IdP Client ID
      description: OIDC client ID for the vendor-owned identity provider.
      group: vendorIdentity
      condition: '{{ input "enableVendorIdp" }}'
    - name: vendorIdpClientSecret
      type: string
      isSecret: true
      displayName: Vendor IdP Client Secret
      description: OIDC client secret for the vendor-owned identity provider.
      group: vendorIdentity
      condition: '{{ input "enableVendorIdp" }}'
    - name: vendorIdpScopes
      type: array
      default: [openid, profile, email]
      displayName: Vendor IdP Scopes
      description: OIDC scopes requested from the vendor-owned identity provider.
      group: vendorIdentity
      condition: '{{ input "enableVendorIdp" }}'
    - name: operatorEmailDomain
      type: string
      default: ryvn.ai
      displayName: Operator Email Domain
      description: Verified non-primary domain on the hub org. Operator emails on this domain route to the hub org.
      group: federation
    - name: masterkey
      type: string
      isSecret: true
      hidden: true
      generated:
        type: random-string
        length: 32
      displayName: Master Key
      description: Generated once and retained across upgrades.
      immutable: true
  outputs:
    - name: issuerUrl
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.issuer_url }}'
      displayName: Issuer URL
      description: Public OIDC issuer URL.
    - name: organizationId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_org_id }}'
      displayName: Organization ID
      description: ZITADEL ID of the platform organization.
    - name: projectId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_project_id }}'
      displayName: Project ID
      description: ZITADEL ID of the Ryvn project used as the API audience.
    - name: dashboardClientId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_ui_client_id }}'
      displayName: Dashboard Client ID
      description: OIDC client ID for the Ryvn dashboard.
    - name: dashboardClientSecret
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_ui_client_secret }}'
      displayName: Dashboard Client Secret
      description: OIDC client secret for the Ryvn dashboard.
      isSecret: true
    - name: grafanaClientId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.grafana_client_id }}'
      displayName: Grafana Client ID
      description: OIDC client ID for Grafana.
    - name: grafanaClientSecret
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.grafana_client_secret }}'
      displayName: Grafana Client Secret
      description: OIDC client secret for Grafana.
      isSecret: true
    - name: cliClientId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_cli_client_id }}'
      displayName: CLI Client ID
      description: Public OIDC client ID for CLI login.
    - name: loginClientPat
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.login_client_pat }}'
      displayName: Login Client PAT
      description: IAM_LOGIN_CLIENT token used by the custom Login V2 UI.
      isSecret: true
    - name: orchestratorClientId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_orchestrator_client_id }}'
      displayName: Orchestrator Client ID
      description: Client ID of the orchestrator API application.
    - name: authProxyClientId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.auth_proxy_client_id }}'
      displayName: Auth Proxy Client ID
      description: Client ID of the auth-proxy API application.
    - name: orchestratorServiceUserId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_orchestrator_svc_user_id }}'
      displayName: Orchestrator Service User ID
      description: User ID of the orchestrator machine account.
    - name: orchestratorServiceAccountJson
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_orchestrator_svc_key_details }}'
      displayName: Orchestrator Service Account
      description: Complete JSON key document mounted as service-account.json.
      isSecret: true
    - name: orchestratorApplicationAccountJson
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_orchestrator_key_details }}'
      displayName: Orchestrator Application Account
      description: Complete JSON key document mounted as application-account.json.
      isSecret: true
    - name: authProxyApplicationAccountJson
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.auth_proxy_key_details }}'
      displayName: Auth Proxy Application Account
      description: Complete JSON key document used by auth-proxy.
      isSecret: true
    - name: idpCallbackUrl
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.idp_callback_url_v2 }}'
      displayName: IdP Callback URL
      description: Login V2 callback URL to register at external identity providers.
    - name: operatorOidcIdpId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.operator_oidc_idp_id }}'
      displayName: Operator IdP ID
      description: ZITADEL identity-provider ID for central Ryvn federation.
    - name: vendorIdpId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.vendor_idp_id }}'
      displayName: Vendor IdP ID
      description: ZITADEL identity-provider ID for the vendor-owned OIDC provider.
    - name: provisionerUserId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_provisioner_user_id }}'
      displayName: Provisioner User ID
      description: User ID of the hub provisioning machine account.
    - name: provisionerClientId
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_provisioner_client_id }}'
      displayName: Provisioner Client ID
      description: Client ID of the hub provisioning machine account.
    - name: provisionerClientSecret
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_provisioner_client_secret }}'
      displayName: Provisioner Client Secret
      description: Client secret of the hub provisioning machine account.
      isSecret: true
    - name: operatorEmailDomain
      type: string
      from: '{{ (serviceInstallation "zitadel-terraform").outputs.ryvn_operator_email_domain }}'
      displayName: Operator Email Domain
      description: Verified non-primary domain for hub operator emails.
  installations:
    - service: zitadel
      name: '{{ ParentInstallationName }}'
      alias: zitadel
      namespace: zitadel
      secrets:
        - name: masterkey
          values:
            - key: masterkey
              valueFromInput:
                name: masterkey
        - name: database
          values:
            - key: user-password
              valueFromInput:
                name: databasePassword
            - key: admin-password
              valueFromInput:
                name: databaseAdminPassword
      config: |
        fullnameOverride: '{{ ParentInstallationName }}'
        replicaCount: 3
        login:
          enabled: false
        tools:
          kubectl:
            image:
              # The chart defaults this to the cluster's patch version, which
              # alpine/k8s does not publish for every GKE release.
              tag: "1.35.8"
        zitadel:
          masterkeySecretName: '{{ k8sSecretName "masterkey" }}'
          configmapConfig:
            ExternalDomain: '{{ input "domain" }}'
            ExternalPort: 443
            ExternalSecure: true
            TLS:
              Enabled: false
            Database:
              Postgres:
                Host: '{{ input "databaseHost" }}'
                Port: 5432
                Database: zitadel
                MaxOpenConns: 20
                MaxIdleConns: 10
                MaxConnLifetime: 30m
                MaxConnIdleTime: 5m
                User:
                  Username: zitadel
                  SSL:
                    Mode: require
                Admin:
                  Username: '{{ input "databaseAdminUsername" }}'
                  ExistingDatabase: '{{ input "databaseAdminDatabase" }}'
                  SSL:
                    Mode: require
            FirstInstance:
              Skip: false
              Org:
                Name: Ryvn Bootstrap
                Machine:
                  Machine:
                    Username: zitadel-terraform-admin
                    Name: Ryvn ZITADEL Terraform Bootstrap
                  MachineKey:
                    ExpirationDate: "9999-12-31T23:59:59Z"
                    Type: 1
                  # The upstream chart otherwise merges in its default IAM_OWNER PAT.
                  Pat: null
        env:
          - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ k8sSecretName "database" }}'
                key: user-password
          - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ k8sSecretName "database" }}'
                key: admin-password
        ingress:
          enabled: true
          className: external-nginx
          annotations:
            cert-manager.io/cluster-issuer: external-issuer
            nginx.ingress.kubernetes.io/backend-protocol: GRPC
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - host: '{{ input "domain" }}'
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - '{{ input "domain" }}'
              secretName: '{{ ParentInstallationName }}-tls'
    - service: zitadel-terraform
      name: '{{ ParentInstallationName }}-config'
      alias: zitadel-terraform
      namespace: zitadel
      provisionsInfrastructure: true
      secrets:
        - name: idp-credentials
          values:
            - key: operator-client-secret
              valueFromInput:
                name: operatorOidcClientSecret
            - key: vendor-client-secret
              valueFromInput:
                name: vendorIdpClientSecret
      config: |
        zitadel_domain: '{{ input "domain" }}'
        zitadel_bootstrap_secret_namespace: '{{ (serviceInstallation "zitadel").namespace }}'
        dashboard_url: '{{ input "dashboardUrl" }}'
        grafana_url: '{{ input "grafanaUrl" }}'
        operator_email_domain: '{{ input "operatorEmailDomain" }}'
        operator_oidc_idp_client_id: '{{ input "operatorOidcClientId" }}'
        operator_oidc_idp_client_secret: '{{ k8sSecretValue "idp-credentials" "operator-client-secret" }}'
        {{- if input "enableVendorIdp" }}
        vendor_idp_name: '{{ input "vendorIdpName" }}'
        vendor_idp_issuer: '{{ input "vendorIdpIssuer" }}'
        vendor_idp_client_id: '{{ input "vendorIdpClientId" }}'
        vendor_idp_client_secret: '{{ k8sSecretValue "idp-credentials" "vendor-client-secret" }}'
        vendor_idp_scopes:
        {{- input "vendorIdpScopes" | toYaml | nindent 10 }}
        {{- end }}
  distribution: internal-managed
