# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: observability-infra
spec:
  description: |
    Ryvn's observability stack (Loki, Grafana, Mimir behind the tenant auth-proxy) as one installation: object storage for Loki and Mimir, a Postgres database for Grafana unless you bring your own, the Loki and Mimir services sized by `profile`, the auth-proxy at `loki.<domain>` / `mimir.<domain>`, and Grafana at `grafana.<domain>`, with TLS from cert-manager. How the pieces fit together: https://ryvn.ai/docs/observability/logs and https://ryvn.ai/docs/observability/metrics.

    `provisioningMode` selects who the stack serves. `hub`: every organization of the hub it is installed beside; sign-in through the environment's `zitadel` installation, organizations and datasources created by that hub's orchestrator, mapped with `hubOrgs`. `dedicated`: the single organization owning the installation; the managing hub issues the OAuth client and gateway identity, Grafana organization 1 is provisioned statically and named `organizationDisplayName`, and `grafanaExposure` chooses the public or internal ingress.

    In dedicated mode, `exposure: private` disables public access and serves the stack through internal Routes. Optional `exposeToTailnet`, with `tailnetDomain` and `tailnetHostnamePrefix`, adds HTTPS access for humans. Grafana login uses its tailnet hostname; collector URLs, internal Routes and PrivateLink configuration are unchanged by the toggle. Tailscale Operator 1.84.0+ and tailnet HTTPS must already be configured. By default, one shared ingress ProxyGroup runs two replicas for the three endpoints; tailnetProxyGroup can reuse an existing ingress group.

    Supported on GCP (GCS + Workload Identity Federation for GKE), AWS (S3 + EKS Pod Identity) and Azure (Blob + Workload Identity). On other providers the buckets and the Grafana database are still created, but Loki, Mimir, the auth-proxy and Grafana are not deployed and the URL outputs are not published. Collectors are deployed separately and reach the stack through the `connectionName`, `lokiIngestUrl` and `mimirIngestUrl` outputs.
  displayName: LGTM Stack
  inputGroups:
    - name: endpoint
      description: Hostnames, network exposure and hub wiring
      displayName: Endpoint
    - name: capacity
      description: Sizing and pod scheduling
      displayName: Capacity
    - name: retention
      description: How long logs and metrics are kept
      displayName: Retention
    - name: grafana
      description: Grafana database and admin credentials
      displayName: Grafana
    - name: protection
      description: Safeguards against accidental data loss
      displayName: Protection
  inputs:
    - name: provisioningMode
      type: string
      default: hub
      displayName: Provisioning mode
      description: |
        `hub`: this stack serves every organization of the hub it is installed beside; sign-in uses the environment's `zitadel` installation and `hubOrgs`; Grafana organizations and datasources are provisioned by that hub's orchestrator.

        `dedicated`: this stack serves the single organization that owns the installation; the managing hub issues the OAuth client and gateway identity and Grafana is provisioned statically.
      group: endpoint
      options:
        - label: Hub
          value: hub
        - label: Dedicated
          value: dedicated
    - name: domain
      type: string
      displayName: Domain
      description: Public root hostname for the stack, without a scheme. Public endpoints use `loki.`, `mimir.` and `grafana.` under it. Private stacks use the environment internal domain automatically; this input can retain its existing value.
      group: endpoint
      immutable: true
    - name: hubUrl
      type: string
      default: ""
      displayName: Hub API URL
      description: Base URL of the Ryvn hub API (for example `https://api.<hub-domain>`) the auth-proxy authorizes tenant requests against. Required in `hub` mode, where it is the API of the hub this stack is installed beside. In `dedicated` mode leave it blank to use the managing hub's API; set it only to authorize against a different hub API URL.
      group: endpoint
    - name: connectionName
      type: string
      default: ""
      displayName: Connection Name
      description: |
        Name remote collectors use to address this stack, in either provisioning mode. Leave blank to use `<installation name>-<hosting environment name>`.

        Must be a valid label value: at most 63 characters of letters, digits, `-`, `_` or `.`, starting and ending with a letter or digit. A generated default that is too long is rejected rather than shortened; set the name explicitly in that case.
      group: endpoint
    - name: exposure
      type: string
      default: public
      displayName: Stack Exposure
      description: Dedicated stacks only. Public keeps the existing Ingress/Route options. Private disables legacy Ingresses and serves all three services through internal Routes on the environment internal domain. Connected Private Service Consumers resolve these names through their private links. Tailscale does not change collector endpoints.
      group: endpoint
      condition: '{{ eq (input "provisioningMode") "dedicated" }}'
      options:
        - label: Public
          value: public
        - label: Private
          value: private
    - name: exposeToTailnet
      type: boolean
      default: false
      displayName: Expose to Tailnet
      description: |
        Available only when Stack Exposure is Private. Add Tailscale HTTPS access to Grafana and the authenticated Loki/Mimir gateways for human access. Does not alter internal Routes, collector endpoints or PrivateLink configuration. Grafana login uses its tailnet URL.

        Requires Tailscale Operator 1.84.0+ with current CRDs and Services write permission, tailnet HTTPS, service advertisement approval (autoApprovers.services), and client access rules. Creates an ingress ProxyGroup with two replicas by default, or reuses the existing ingress group named by tailnetProxyGroup. Use at least two eligible nodes for node-failure resilience. Collectors use the environment's internal gateway and must have network and DNS access to it.
      group: endpoint
      condition: '{{ and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}'
    - name: tailnetDomain
      type: string
      displayName: Tailnet Domain
      description: Tailnet DNS suffix, for example example.ts.net, without a scheme or trailing dot. Must match the tailnet used by the Kubernetes operator.
      group: endpoint
      condition: '{{ and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") }}'
    - name: tailnetHostnamePrefix
      type: string
      displayName: Tailnet Hostname Prefix
      description: Unique prefix for the three Tailscale Services and any blueprint-created ProxyGroup, for example hs-lgtm-cp. Creates <prefix>-grafana, <prefix>-loki and <prefix>-mimir. Use at most 53 lowercase letters, digits or hyphens, starting and ending with a letter or digit; these service names must be unused on the tailnet.
      group: endpoint
      condition: '{{ and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") }}'
    - name: tailnetProxyGroup
      type: string
      default: ""
      displayName: Existing Tailnet Proxy Group
      description: Existing ProxyGroup in this cluster with type ingress, managed outside this installation. Leave blank to create a dedicated group with two replicas. When set, LGTM creates only Ingresses and uses the group's existing class, replicas, tags and scheduling. Kubernetes API and egress groups cannot be reused for ingress.
      group: endpoint
      condition: '{{ and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") }}'
    - name: tailnetProxyClass
      type: string
      default: ""
      displayName: Tailnet Proxy Class
      description: Existing ProxyClass to use when creating a group. Ignored when tailnetProxyGroup is set. Set this if your operator relies on custom scheduling or security settings; those settings are not inherited by the generated class. Leave blank to create a class that prefers separate nodes. An existing class should configure replica spreading.
      group: endpoint
      condition: '{{ and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") (not (input "tailnetProxyGroup")) }}'
    - name: grafanaExposure
      type: string
      default: public
      displayName: Grafana Exposure
      description: Applies to `dedicated` mode only; in `hub` mode Grafana is always published at `grafana.<domain>` because the `zitadel` installation registers that callback. Ignored when Stack Exposure is Private. Public publishes Grafana at `grafana.<domain>` on the ingress class below. Private publishes it on the `internal-nginx` ingress class under the environment's internal domain, reachable only from inside the network; hub sign-in stays enabled either way.
      group: endpoint
      condition: '{{ eq (input "provisioningMode") "dedicated" }}'
      options:
        - label: Public
          value: public
        - label: Private
          value: private
    - name: hubOrgs
      type: map
      default: {}
      displayName: Grafana Organization Mapping
      description: |
        Maps hub (Zitadel) organization ids to Grafana organization ids. Members of a hub organization sign in to Grafana as Editors of the mapped Grafana organization. The Grafana organizations and their Loki/Mimir datasources are created by the hub's orchestrator; look up the ids under Server admin → Organizations.

        Synthetic example: `"111111111111111111": "2"`.
      group: endpoint
      condition: '{{ eq (input "provisioningMode") "hub" }}'
    - name: ingressEnabled
      type: boolean
      default: true
      displayName: Create Ingresses
      description: Create Ingress resources for Loki, Mimir and Grafana. Disabled when Stack Exposure is Private; Tailscale Ingresses are controlled separately.
      group: endpoint
    - name: routesEnabled
      type: boolean
      default: false
      displayName: Create Ryvn Routes
      description: Publish Loki, Mimir and Grafana through Ryvn Routes (ryvn-routes) on the managed gateway. When Stack Exposure is Private, internal Routes are always created and public Routes are disabled, independently of Tailscale.
      group: endpoint
    - name: ingressClassName
      type: string
      default: external-nginx
      displayName: Ingress Class
      description: IngressClass that publishes the Loki, Mimir and Grafana hostnames. The default matches the internet-facing ingress-nginx installed by the platform blueprints.
      group: endpoint
    - name: clusterIssuer
      type: string
      default: external-issuer
      displayName: Certificate Issuer
      description: cert-manager ClusterIssuer that signs the TLS certificates for the public hostnames. The default matches the issuer installed by the platform blueprints.
      group: endpoint
    - name: profile
      type: string
      default: small
      displayName: Profile
      description: Sizing profile for the Loki, Mimir and Grafana services. Small suits a hub with a handful of workload environments; medium is sized for production hubs.
      group: capacity
      options:
        - label: Small
          value: small
        - label: Medium
          value: medium
    - name: nodeGroup
      type: string
      default: ""
      displayName: Node Group
      description: Value of the `ryvn.app/node-group-name` label for LGTM pods, including caches and the managed Grafana database helper (for example `observability`). Leave blank to omit this node selector. Tailscale proxy placement is configured separately through its ProxyClass.
      group: capacity
    - name: tolerations
      type: string
      default: ""
      multiline: true
      displayName: Pod Tolerations
      description: YAML list of Kubernetes tolerations for LGTM pods and the managed Grafana database helper. Use with Node Group to schedule on a tainted pool. Leave blank to retain chart defaults. Tailscale proxies use their ProxyClass instead.
      group: capacity
    - name: storageClassName
      type: string
      default: ""
      displayName: Storage Class
      description: Storage class for the Loki and Mimir persistent volumes (ingester write-ahead logs, compactor and store-gateway scratch, alertmanager state; durable data lives in the buckets). Grafana recommends SSD-backed disks for ingesters. Empty uses the cluster default. Changing it later recreates those volumes.
      group: capacity
    - name: lokiRetentionDays
      type: number
      default: 30
      displayName: Log Retention (Days)
      description: Days the Loki compactor keeps log chunks before deleting them.
      group: retention
    - name: mimirBlockRetentionDays
      type: number
      default: 160
      displayName: Metrics Retention (Days)
      description: Days the Mimir compactor keeps metric blocks before deleting them.
      group: retention
    - name: useExternalGrafanaDatabase
      type: boolean
      default: false
      displayName: Use External Grafana Database
      description: Point Grafana at a Postgres database you manage instead of provisioning a dedicated one with this installation.
      group: grafana
    - name: grafanaDatabaseUrl
      type: string
      isSecret: true
      displayName: Grafana Database URL
      description: Postgres connection URL (`postgres://user:password@host:5432/grafana?sslmode=require`) for Grafana when using an external database.
      group: grafana
      condition: '{{ input "useExternalGrafanaDatabase" }}'
    - name: grafanaAdminPassword
      type: string
      isSecret: true
      hidden: true
      generated:
        type: random-string
        length: 24
      displayName: Grafana Admin Password
      description: Generated once for the built-in Grafana `admin` user and retained across upgrades.
      group: grafana
    - name: datasourceSecret
      type: string
      isSecret: true
      hidden: true
      generated:
        type: random-string
        length: 32
      displayName: Datasource Secret
      description: Used in `dedicated` mode only. Generated once; Grafana's Loki and Mimir datasources present it to the auth-proxy as the Basic auth password of user `grafana`.
      group: grafana
      condition: '{{ eq (input "provisioningMode") "dedicated" }}'
    - name: organizationDisplayName
      type: string
      default: ""
      displayName: Organization Display Name
      description: Applies to `dedicated` mode only. Name shown for Grafana organization 1, applied after every install and upgrade. Leave blank to use the id of the organization that owns this installation.
      group: grafana
      condition: '{{ eq (input "provisioningMode") "dedicated" }}'
    - name: deletionProtection
      type: boolean
      default: true
      displayName: Deletion Protection
      description: Protects the buckets and the Grafana database from accidental destruction. Disable before tearing down the stack.
      group: protection
  outputs:
    - name: connectionName
      type: string
      from: '{{ if input "connectionName" }}{{ input "connectionName" }}{{ else }}{{ .ryvn.installation.name }}-{{ EnvironmentName }}{{ end }}'
      description: Name remote collectors use to address this stack.
      displayName: Connection Name
    - name: lokiIngestUrl
      type: string
      condition: '{{ or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure") }}'
      from: 'https://loki.{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}{{ EnvironmentInternalDomain }}{{ else }}{{ input "domain" }}{{ end }}'
      description: Base URL remote collectors push logs to.
      displayName: Loki Ingest URL
    - name: mimirIngestUrl
      type: string
      condition: '{{ or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure") }}'
      from: 'https://mimir.{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}{{ EnvironmentInternalDomain }}{{ else }}{{ input "domain" }}{{ end }}'
      description: Base URL remote collectors push metrics to.
      displayName: Mimir Ingest URL
    - name: lokiUrl
      type: string
      condition: '{{ or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure") }}'
      from: 'https://loki.{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}{{ EnvironmentInternalDomain }}{{ else }}{{ input "domain" }}{{ end }}'
      description: Loki endpoint behind the auth-proxy. Tailscale does not change this URL. Set it as the platform blueprint's `lokiUrl` input in each workload environment whose collector should ship here.
      displayName: Loki URL
    - name: mimirUrl
      type: string
      condition: '{{ or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure") }}'
      from: 'https://mimir.{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}{{ EnvironmentInternalDomain }}{{ else }}{{ input "domain" }}{{ end }}'
      description: Mimir endpoint behind the auth-proxy. Tailscale does not change this URL. Set it as the platform blueprint's `mimirUrl` input in each workload environment whose collector should ship here.
      displayName: Mimir URL
    - name: lokiTailnetUrl
      type: string
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") }}'
      from: 'https://{{ input "tailnetHostnamePrefix" }}-loki.{{ input "tailnetDomain" }}'
      description: HTTPS tailnet endpoint for loki through the tenant auth-proxy. Existing API credentials are still required.
      displayName: Loki Tailnet URL
    - name: mimirTailnetUrl
      type: string
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") }}'
      from: 'https://{{ input "tailnetHostnamePrefix" }}-mimir.{{ input "tailnetDomain" }}'
      description: HTTPS tailnet endpoint for mimir through the tenant auth-proxy. Existing API credentials are still required.
      displayName: Mimir Tailnet URL
    - name: grafanaUrl
      type: string
      condition: '{{ or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure") }}'
      from: '{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") }}https://{{ input "tailnetHostnamePrefix" }}-grafana.{{ input "tailnetDomain" }}{{ else if and (eq (input "provisioningMode") "dedicated") (or (eq (input "exposure") "private") (eq (input "grafanaExposure") "private")) }}https://grafana.{{ EnvironmentInternalDomain }}{{ else }}https://grafana.{{ input "domain" }}{{ end }}'
      description: Canonical Grafana URL on the tailnet when exposeToTailnet is enabled, otherwise on the public domain, or on the environment's internal domain when a dedicated stack's Grafana exposure is private. In hub mode it must match the `grafanaUrl` input of the zitadel installation so the OAuth redirect is accepted.
      displayName: Grafana URL
    - name: lokiBucketName
      type: string
      from: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
      description: Object storage bucket holding Loki chunks and ruler state.
      displayName: Loki Bucket
    - name: mimirBucketName
      type: string
      from: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
      description: Object storage bucket holding Mimir blocks, ruler and alertmanager state.
      displayName: Mimir Bucket
    - name: grafanaAdminPassword
      type: string
      from: '{{ input "grafanaAdminPassword" }}'
      description: Password for the built-in Grafana `admin` user.
      displayName: Grafana Admin Password
      isSecret: true
  installations:
    - blueprint: bucket
      name: '{{ ParentInstallationName }}-loki'
      alias: loki-bucket
      inputs:
        - name: bucketName
          value: observability-loki
        - name: noncurrentVersionExpirationDays
          value: 7
        - name: deletionProtection
          valueFromInput:
            name: deletionProtection
    - blueprint: bucket
      name: '{{ ParentInstallationName }}-mimir'
      alias: mimir-bucket
      inputs:
        - name: bucketName
          value: observability-mimir
        - name: noncurrentVersionExpirationDays
          value: 7
        - name: deletionProtection
          valueFromInput:
            name: deletionProtection
    - service: gcp-workload-identity
      name: '{{ ParentInstallationName }}-loki-access'
      alias: loki-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        project_id: '{{ .ryvn.env.provider.gcp.projectId }}'
        name_prefix: '{{ ParentInstallationName }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          loki:
            associations:
              loki:
                namespace: observability
                service_account: loki
            buckets:
              bucket:
                name: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
                role: '{{ (blueprintInstallation "loki-bucket").outputs.iamRole }}'
    - service: gcp-workload-identity
      name: '{{ ParentInstallationName }}-mimir-access'
      alias: mimir-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        project_id: '{{ .ryvn.env.provider.gcp.projectId }}'
        name_prefix: '{{ ParentInstallationName }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          mimir:
            associations:
              mimir:
                namespace: observability
                service_account: mimir
            buckets:
              bucket:
                name: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
                role: '{{ (blueprintInstallation "mimir-bucket").outputs.iamRole }}'
    - service: azure-workload-identity
      name: '{{ ParentInstallationName }}-loki-access'
      alias: loki-azure-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "azure" }}'
      config: |
        location: '{{ .ryvn.env.state.resource_group.location }}'
        resource_group_name: '{{ .ryvn.env.state.resource_group.name }}'
        oidc_issuer_url: '{{ .ryvn.env.state.cluster.oidc_issuer_url }}'
        name_prefix: '{{ ParentInstallationName }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          loki:
            associations:
              loki:
                namespace: observability
                service_account: loki
            role_assignments:
              bucket:
                scope: '{{ (blueprintInstallation "loki-bucket").outputs.roleAssignmentScope }}'
                role_definition_name: '{{ (blueprintInstallation "loki-bucket").outputs.roleDefinitionName }}'
    - service: azure-workload-identity
      name: '{{ ParentInstallationName }}-mimir-access'
      alias: mimir-azure-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "azure" }}'
      config: |
        location: '{{ .ryvn.env.state.resource_group.location }}'
        resource_group_name: '{{ .ryvn.env.state.resource_group.name }}'
        oidc_issuer_url: '{{ .ryvn.env.state.cluster.oidc_issuer_url }}'
        name_prefix: '{{ ParentInstallationName }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          mimir:
            associations:
              mimir:
                namespace: observability
                service_account: mimir
            role_assignments:
              bucket:
                scope: '{{ (blueprintInstallation "mimir-bucket").outputs.roleAssignmentScope }}'
                role_definition_name: '{{ (blueprintInstallation "mimir-bucket").outputs.roleDefinitionName }}'
    # On AWS the bucket blueprint associates Pod Identity only in the environment's
    # default namespace, so the observability ServiceAccounts get their own IAM roles
    # here, each carrying the bucket's managed access policy.
    - service: aws-workload-identity
      name: '{{ ParentInstallationName }}-loki-access'
      alias: loki-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "aws" }}'
      config: |
        aws_region: '{{ .ryvn.env.state.cluster_region }}'
        eks_cluster_name: '{{ .ryvn.env.state.cluster_name }}'
        name_prefix: '{{ ParentInstallationName }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          loki:
            associations:
              loki:
                namespace: observability
                service_account: loki
            policy_arns:
              bucket: '{{ (blueprintInstallation "loki-bucket").outputs.iamPolicyArn }}'
    - service: aws-workload-identity
      name: '{{ ParentInstallationName }}-mimir-access'
      alias: mimir-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "aws" }}'
      config: |
        aws_region: '{{ .ryvn.env.state.cluster_region }}'
        eks_cluster_name: '{{ .ryvn.env.state.cluster_name }}'
        name_prefix: '{{ ParentInstallationName }}'
        environment: '{{ .ryvn.env.name }}'
        role_groups:
          mimir:
            associations:
              mimir:
                namespace: observability
                service_account: mimir
            policy_arns:
              bucket: '{{ (blueprintInstallation "mimir-bucket").outputs.iamPolicyArn }}'
    - service: loki
      name: '{{ ParentInstallationName }}-loki-svc'
      alias: loki-svc
      namespace: observability
      condition: '{{ or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure") }}'
      config: |
        deploymentMode: Distributed
        loki:
          auth_enabled: true
          {{- if eq EnvironmentProviderType "gcp" }}
          # Referencing the access binding orders this install after the bucket IAM binding has applied.
          podAnnotations:
            ryvn.app/workload-access-project-number: '{{ (serviceInstallation "loki-access").outputs.project_number }}'
          {{- else if eq EnvironmentProviderType "aws" }}
          # Referencing the access role orders this install after the Pod Identity association has applied.
          podAnnotations:
            ryvn.app/workload-access-role-arn: '{{ (serviceInstallation "loki-access").outputs.role_arns.loki }}'
          {{- else if eq EnvironmentProviderType "azure" }}
          podLabels:
            azure.workload.identity/use: "true"
          {{- end }}
          storage:
            {{- if eq EnvironmentProviderType "gcp" }}
            type: gcs
            gcs:
              chunkBufferSize: 0
              requestTimeout: "0s"
              enableHttp2: true
            {{- else if eq EnvironmentProviderType "aws" }}
            # Credentials come from the SDK default chain (EKS Pod Identity); no static keys.
            type: s3
            s3:
              region: '{{ .ryvn.env.state.cluster_region }}'
              s3ForcePathStyle: false
            {{- else if eq EnvironmentProviderType "azure" }}
            type: azure
            azure:
              accountName: '{{ (blueprintInstallation "loki-bucket").outputs.storageAccountName }}'
              useFederatedToken: true
            {{- end }}
            bucketNames:
              chunks: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
              ruler: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
              admin: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else if eq EnvironmentProviderType "aws" }}s3{{ else if eq EnvironmentProviderType "azure" }}azure{{ end }}
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage_config:
            tsdb_shipper:
              active_index_directory: /var/loki/tsdb-index
              cache_location: /var/loki/tsdb-cache
          ingester:
            chunk_encoding: snappy
          pattern_ingester:
            enabled: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            retention_period: '{{ input "lokiRetentionDays" }}d'
            ingestion_rate_mb: 16
          compactor:
            retention_enabled: true
            delete_request_store: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else if eq EnvironmentProviderType "aws" }}s3{{ else if eq EnvironmentProviderType "azure" }}azure{{ end }}
          ruler:
            enable_api: true
