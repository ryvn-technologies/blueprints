# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: observability-infra
spec:
  description: |
    Ryvn's observability stack (Loki, Grafana, Mimir behind the tenant auth-proxy) as one installation: object storage for Loki and Mimir, a Postgres database for Grafana unless you bring your own, the Loki and Mimir services sized by `profile`, the auth-proxy at `loki.<domain>` / `mimir.<domain>`, and Grafana at `grafana.<domain>`, with TLS from cert-manager. How the pieces fit together: https://ryvn.ai/docs/observability/logs and https://ryvn.ai/docs/observability/metrics.

    `provisioningMode` selects who the stack serves. `hub`: every organization of the hub it is installed beside; sign-in through the environment's `zitadel` installation, organizations and datasources created by that hub's orchestrator, mapped with `hubOrgs`. `dedicated`: the single organization owning the installation; the managing hub issues the OAuth client and gateway identity, Grafana organization 1 is provisioned statically and named `organizationDisplayName`, and `grafanaExposure` chooses the public or internal ingress.

    Supported on GCP (GCS + Workload Identity). On other providers the buckets and the Grafana database are still created, but Loki, Mimir, the auth-proxy and Grafana are not deployed and the URL outputs are not published. Collectors are deployed separately and reach the stack through the `connectionName`, `lokiIngestUrl` and `mimirIngestUrl` outputs.
  displayName: LGTM Stack
  inputGroups:
    - name: endpoint
      description: Public hostname and hub wiring
      displayName: Endpoint
    - name: capacity
      description: Sizing profile
      displayName: Capacity
    - name: retention
      description: How long logs and metrics are kept
      displayName: Retention
    - name: grafana
      description: Grafana database and admin credentials
      displayName: Grafana
    - name: protection
      description: Safeguards against accidental data loss
      displayName: Protection
  inputs:
    - name: provisioningMode
      type: string
      default: hub
      displayName: Provisioning mode
      description: |
        `hub`: this stack serves every organization of the hub it is installed beside; sign-in uses the environment's `zitadel` installation and `hubOrgs`; Grafana organizations and datasources are provisioned by that hub's orchestrator.

        `dedicated`: this stack serves the single organization that owns the installation; the managing hub issues the OAuth client and gateway identity and Grafana is provisioned statically.
      group: endpoint
      options:
        - label: Hub
          value: hub
        - label: Dedicated
          value: dedicated
    - name: domain
      type: string
      displayName: Domain
      description: Root hostname for the stack, without a scheme. Loki, Mimir and Grafana are exposed as `loki.`, `mimir.` and `grafana.` under it.
      group: endpoint
      immutable: true
    - name: hubUrl
      type: string
      default: ""
      displayName: Hub API URL
      description: Base URL of the Ryvn hub API (for example `https://api.<hub-domain>`) the auth-proxy authorizes tenant requests against. Required in `hub` mode, where it is the API of the hub this stack is installed beside. In `dedicated` mode leave it blank to use the managing hub's API; set it only to authorize against a different hub API URL.
      group: endpoint
    - name: connectionName
      type: string
      default: ""
      displayName: Connection Name
      description: |
        Name remote collectors use to address this stack, in either provisioning mode. Leave blank to use `<installation name>-<hosting environment name>`.

        Must be a valid label value: at most 63 characters of letters, digits, `-`, `_` or `.`, starting and ending with a letter or digit. A generated default that is too long is rejected rather than shortened; set the name explicitly in that case.
      group: endpoint
    - name: grafanaExposure
      type: string
      default: public
      displayName: Grafana Exposure
      description: Applies to `dedicated` mode only; in `hub` mode Grafana is always published at `grafana.<domain>` because the `zitadel` installation registers that callback. Public publishes Grafana at `grafana.<domain>` on the ingress class below. Private publishes it on the `internal-nginx` ingress class under the environment's internal domain, reachable only from inside the network; hub sign-in stays enabled either way.
      group: endpoint
      condition: '{{ eq (input "provisioningMode") "dedicated" }}'
      options:
        - label: Public
          value: public
        - label: Private
          value: private
    - name: hubOrgs
      type: map
      default: {}
      displayName: Grafana Organization Mapping
      description: |
        Maps hub (Zitadel) organization ids to Grafana organization ids. Members of a hub organization sign in to Grafana as Editors of the mapped Grafana organization. The Grafana organizations and their Loki/Mimir datasources are created by the hub's orchestrator; look up the ids under Server admin → Organizations.

        Example: `"298765826054437928": "2"`.
      group: endpoint
      condition: '{{ eq (input "provisioningMode") "hub" }}'
    - name: ingressClassName
      type: string
      default: external-nginx
      displayName: Ingress Class
      description: IngressClass that publishes the Loki, Mimir and Grafana hostnames. The default matches the internet-facing ingress-nginx installed by the platform blueprints.
      group: endpoint
    - name: clusterIssuer
      type: string
      default: external-issuer
      displayName: Certificate Issuer
      description: cert-manager ClusterIssuer that signs the TLS certificates for the public hostnames. The default matches the issuer installed by the platform blueprints.
      group: endpoint
    - name: profile
      type: string
      default: small
      displayName: Profile
      description: Sizing profile for the Loki, Mimir and Grafana services. Small suits a hub with a handful of workload environments; medium is sized for production hubs.
      group: capacity
      options:
        - label: Small
          value: small
        - label: Medium
          value: medium
    - name: nodeGroup
      type: string
      default: ""
      displayName: Node Group
      description: Value of the `ryvn.app/node-group-name` label of the node pool that runs Loki and Mimir (for example `observability`). Leave blank to schedule on any node.
      group: capacity
    - name: authProxyImagePullSecret
      type: string
      default: ryvn-registry-credentials
      displayName: Auth-Proxy Image Pull Secret
      description: Kubernetes secret holding credentials for the private Ryvn registry that publishes the auth-proxy image. The ryvn-agent writes the registry's credentials into every managed namespace under this name; leave blank if the image is pullable anonymously.
      group: capacity
    - name: storageClassName
      type: string
      default: ""
      displayName: Storage Class
      description: Storage class for the Loki and Mimir persistent volumes (ingester write-ahead logs, compactor and store-gateway scratch, alertmanager state; durable data lives in the buckets). Grafana recommends SSD-backed disks for ingesters. Empty uses the cluster default. Changing it later recreates those volumes.
      group: capacity
    - name: lokiRetentionDays
      type: number
      default: 30
      displayName: Log Retention (Days)
      description: Days the Loki compactor keeps log chunks before deleting them.
      group: retention
    - name: mimirBlockRetentionDays
      type: number
      default: 160
      displayName: Metrics Retention (Days)
      description: Days the Mimir compactor keeps metric blocks before deleting them.
      group: retention
    - name: useExternalGrafanaDatabase
      type: boolean
      default: false
      displayName: Use External Grafana Database
      description: Point Grafana at a Postgres database you manage instead of provisioning a dedicated one with this installation.
      group: grafana
    - name: grafanaDatabaseUrl
      type: string
      isSecret: true
      displayName: Grafana Database URL
      description: Postgres connection URL (`postgres://user:password@host:5432/grafana?sslmode=require`) for Grafana when using an external database.
      group: grafana
      condition: '{{ input "useExternalGrafanaDatabase" }}'
    - name: grafanaAdminPassword
      type: string
      isSecret: true
      hidden: true
      generated:
        type: random-string
        length: 24
      displayName: Grafana Admin Password
      description: Generated once for the built-in Grafana `admin` user and retained across upgrades.
      group: grafana
    - name: datasourceSecret
      type: string
      isSecret: true
      hidden: true
      generated:
        type: random-string
        length: 32
      displayName: Datasource Secret
      description: Used in `dedicated` mode only. Generated once; Grafana's Loki and Mimir datasources present it to the auth-proxy as the Basic auth password of user `grafana`.
      group: grafana
      condition: '{{ eq (input "provisioningMode") "dedicated" }}'
    - name: organizationDisplayName
      type: string
      default: ""
      displayName: Organization Display Name
      description: Applies to `dedicated` mode only. Name shown for Grafana organization 1, applied after every install and upgrade. Leave blank to use the id of the organization that owns this installation.
      group: grafana
      condition: '{{ eq (input "provisioningMode") "dedicated" }}'
    - name: deletionProtection
      type: boolean
      default: true
      displayName: Deletion Protection
      description: Protects the buckets and the Grafana database from accidental destruction. Disable before tearing down the stack.
      group: protection
  outputs:
    - name: connectionName
      type: string
      from: '{{ if input "connectionName" }}{{ input "connectionName" }}{{ else }}{{ .ryvn.installation.name }}-{{ EnvironmentName }}{{ end }}'
      description: Name remote collectors use to address this stack.
      displayName: Connection Name
    - name: lokiIngestUrl
      type: string
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      from: 'https://loki.{{ input "domain" }}'
      description: Base URL remote collectors push logs to.
      displayName: Loki Ingest URL
    - name: mimirIngestUrl
      type: string
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      from: 'https://mimir.{{ input "domain" }}'
      description: Base URL remote collectors push metrics to.
      displayName: Mimir Ingest URL
    - name: lokiUrl
      type: string
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      from: 'https://loki.{{ input "domain" }}'
      description: Public Loki endpoint behind the auth-proxy. Set it as the platform blueprint's `lokiUrl` input in each workload environment whose collector should ship here.
      displayName: Loki URL
    - name: mimirUrl
      type: string
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      from: 'https://mimir.{{ input "domain" }}'
      description: Public Mimir endpoint behind the auth-proxy. Set it as the platform blueprint's `mimirUrl` input in each workload environment whose collector should ship here.
      displayName: Mimir URL
    - name: grafanaUrl
      type: string
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      from: '{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "grafanaExposure") "private") }}https://grafana.{{ EnvironmentInternalDomain }}{{ else }}https://grafana.{{ input "domain" }}{{ end }}'
      description: Grafana URL on the public domain, or on the environment's internal domain when a dedicated stack's Grafana exposure is private. In hub mode it must match the `grafanaUrl` input of the zitadel installation so the OAuth redirect is accepted.
      displayName: Grafana URL
    - name: lokiBucketName
      type: string
      from: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
      description: Object storage bucket holding Loki chunks and ruler state.
      displayName: Loki Bucket
    - name: mimirBucketName
      type: string
      from: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
      description: Object storage bucket holding Mimir blocks, ruler and alertmanager state.
      displayName: Mimir Bucket
    - name: grafanaAdminPassword
      type: string
      from: '{{ input "grafanaAdminPassword" }}'
      description: Password for the built-in Grafana `admin` user.
      displayName: Grafana Admin Password
      isSecret: true
  installations:
    - blueprint: bucket
      name: '{{ ParentInstallationName }}-loki'
      alias: loki-bucket
      inputs:
        - name: bucketName
          value: observability-loki
        - name: noncurrentVersionExpirationDays
          value: 7
        - name: deletionProtection
          valueFromInput:
            name: deletionProtection
    - blueprint: bucket
      name: '{{ ParentInstallationName }}-mimir'
      alias: mimir-bucket
      inputs:
        - name: bucketName
          value: observability-mimir
        - name: noncurrentVersionExpirationDays
          value: 7
        - name: deletionProtection
          valueFromInput:
            name: deletionProtection
    - service: gcp-workload-access
      name: '{{ ParentInstallationName }}-loki-access'
      alias: loki-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        project_id: '{{ .ryvn.env.provider.gcp.projectId }}'
        namespace: observability
        service_accounts: ['loki']
        grants: {{ (blueprintInstallation "loki-bucket").outputs.workloadGrants }}
    - service: gcp-workload-access
      name: '{{ ParentInstallationName }}-mimir-access'
      alias: mimir-access
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        project_id: '{{ .ryvn.env.provider.gcp.projectId }}'
        namespace: observability
        service_accounts: ['mimir']
        grants: {{ (blueprintInstallation "mimir-bucket").outputs.workloadGrants }}
    - service: loki
      name: '{{ ParentInstallationName }}-loki-svc'
      alias: loki-svc
      namespace: observability
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        deploymentMode: Distributed
        loki:
          auth_enabled: true
          {{- if eq EnvironmentProviderType "gcp" }}
          # Referencing the access binding orders this install after the bucket IAM binding has applied.
          podAnnotations:
            ryvn.app/workload-access-project-number: '{{ (serviceInstallation "loki-access").outputs.project_number }}'
          {{- end }}
          storage:
            {{- if eq EnvironmentProviderType "gcp" }}
            type: gcs
            gcs:
              chunkBufferSize: 0
              requestTimeout: "0s"
              enableHttp2: true
            {{- else }}
            type: s3
            s3:
              region: '{{ .ryvn.env.state.cluster_region }}'
              s3ForcePathStyle: false
            {{- end }}
            bucketNames:
              chunks: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
              ruler: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
              admin: '{{ (blueprintInstallation "loki-bucket").outputs.bucketName }}'
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else }}s3{{ end }}
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage_config:
            tsdb_shipper:
              active_index_directory: /var/loki/tsdb-index
              cache_location: /var/loki/tsdb-cache
          ingester:
            chunk_encoding: snappy
          pattern_ingester:
            enabled: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            retention_period: '{{ input "lokiRetentionDays" }}d'
            ingestion_rate_mb: 16
          compactor:
            retention_enabled: true
            delete_request_store: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else }}s3{{ end }}
          ruler:
            enable_api: true
            alertmanager_url: 'http://{{ ParentInstallationName }}-mimir-svc-alertmanager-headless.observability.svc.cluster.local:8080'
          server:
            grpc_server_max_recv_msg_size: 52428800
            grpc_server_max_send_msg_size: 52428800
          querier:
            max_concurrent: 4
        serviceAccount:
          create: true
          name: loki
        test:
          enabled: false
        lokiCanary:
          enabled: false
        bloomPlanner:
          replicas: 0
        bloomBuilder:
          replicas: 0
        bloomGateway:
          replicas: 0
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        singleBinary:
          replicas: 0
        minio:
          enabled: false
        ingester:
          replicas: 3
          persistence:
            enabled: true
            claims:
              - name: data
                size: 30Gi
                storageClass: {{ if input "storageClassName" }}'{{ input "storageClassName" }}'{{ else }}null{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        distributor:
          replicas: {{ if eq (input "profile") "medium" }}3{{ else }}1{{ end }}
          maxUnavailable: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        querier:
          replicas: {{ if eq (input "profile") "medium" }}3{{ else }}1{{ end }}
          maxUnavailable: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        queryFrontend:
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          maxUnavailable: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        queryScheduler:
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          maxUnavailable: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        compactor:
          replicas: 1
          persistence:
            enabled: true
            claims:
              - name: data
                size: 10Gi
                storageClass: {{ if input "storageClassName" }}'{{ input "storageClassName" }}'{{ else }}null{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        indexGateway:
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          maxUnavailable: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        ruler:
          replicas: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        patternIngester:
          replicas: {{ if eq (input "profile") "medium" }}3{{ else }}1{{ end }}
          maxUnavailable: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        gateway:
          enabled: true
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: '{{ input "ingressClassName" }}'
            annotations:
              cert-manager.io/cluster-issuer: '{{ input "clusterIssuer" }}'
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
            hosts:
              - host: 'loki.{{ input "domain" }}'
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: '{{ ParentInstallationName }}-loki-gateway-tls'
                hosts:
                  - 'loki.{{ input "domain" }}'
          nginxConfig:
            serverSnippet: |
              location = /auth {
                internal;
                proxy_pass http://{{ ParentInstallationName }}-auth-proxy.observability.svc.cluster.local:9545/auth;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header X-Original-URI $request_uri;
              }

              auth_request /auth;
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
    - service: mimir
      name: '{{ ParentInstallationName }}-mimir-svc'
      alias: mimir-svc
      namespace: observability
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        serviceAccount:
          create: true
          name: mimir
        {{- if eq EnvironmentProviderType "gcp" }}
        global:
          # Referencing the access binding orders this install after the bucket IAM binding has applied.
          podAnnotations:
            ryvn.app/workload-access-project-number: '{{ (serviceInstallation "mimir-access").outputs.project_number }}'
        {{- end }}
        mimir:
          structuredConfig:
            multitenancy_enabled: true
            limits:
              compactor_blocks_retention_period: '{{ input "mimirBlockRetentionDays" }}d'
              ingestion_rate: 200000
              max_global_series_per_user: 2000000
              out_of_order_time_window: 10m
            common:
              storage:
                {{- if eq EnvironmentProviderType "gcp" }}
                backend: gcs
                gcs:
                  bucket_name: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
                {{- else }}
                backend: s3
                s3:
                  endpoint: 's3.{{ .ryvn.env.state.cluster_region }}.amazonaws.com'
                  region: '{{ .ryvn.env.state.cluster_region }}'
                  bucket_name: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
                {{- end }}
            blocks_storage:
              backend: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else }}s3{{ end }}
              storage_prefix: blocks
            ruler_storage:
              storage_prefix: ruler
            alertmanager_storage:
              backend: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else }}s3{{ end }}
              storage_prefix: alertmanager
        minio:
          enabled: false
        nginx:
          enabled: false
        {{- if ne (input "profile") "medium" }}
        chunks-cache:
          enabled: false
        index-cache:
          enabled: false
        metadata-cache:
          enabled: false
        results-cache:
          enabled: false
        {{- else }}
        chunks-cache:
          enabled: true
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        index-cache:
          enabled: true
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        metadata-cache:
          enabled: true
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        results-cache:
          enabled: true
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        {{- end }}
        distributor:
          replicas: {{ if eq (input "profile") "medium" }}4{{ else }}1{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        ingester:
          replicas: 3
          zoneAwareReplication:
            enabled: false
          persistentVolume:
            size: 50Gi
            storageClass: {{ if input "storageClassName" }}'{{ input "storageClassName" }}'{{ else }}null{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        store_gateway:
          replicas: {{ if eq (input "profile") "medium" }}3{{ else }}1{{ end }}
          zoneAwareReplication:
            enabled: false
          persistentVolume:
            storageClass: {{ if input "storageClassName" }}'{{ input "storageClassName" }}'{{ else }}null{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        alertmanager:
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          persistentVolume:
            enabled: true
            storageClass: {{ if input "storageClassName" }}'{{ input "storageClassName" }}'{{ else }}null{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        compactor:
          replicas: 1
          persistentVolume:
            size: 20Gi
            storageClass: {{ if input "storageClassName" }}'{{ input "storageClassName" }}'{{ else }}null{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        querier:
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        query_frontend:
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        query_scheduler:
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        ruler:
          replicas: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        overrides_exporter:
          replicas: 1
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        rollout_operator:
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        gateway:
          enabledNonEnterprise: true
          replicas: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: '{{ input "ingressClassName" }}'
            annotations:
              cert-manager.io/cluster-issuer: '{{ input "clusterIssuer" }}'
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
            hosts:
              - host: 'mimir.{{ input "domain" }}'
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: '{{ ParentInstallationName }}-mimir-gateway-tls'
                hosts:
                  - 'mimir.{{ input "domain" }}'
          nginx:
            config:
              serverSnippet: |
                location = /auth {
                  internal;
                  proxy_pass http://{{ ParentInstallationName }}-auth-proxy.observability.svc.cluster.local:9545/auth;
                  proxy_pass_request_body off;
                  proxy_set_header Content-Length "";
                  proxy_set_header X-Original-URI $request_uri;
                }

                auth_request /auth;
          nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
    - service: auth-proxy
      name: '{{ ParentInstallationName }}-auth-proxy'
      alias: auth-proxy
      namespace: observability
      condition: '{{ and (eq EnvironmentProviderType "gcp") (eq (input "provisioningMode") "hub") }}'
      config: |
        replicaCount: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        imagePullSecrets: {{ if input "authProxyImagePullSecret" }}[{name: '{{ input "authProxyImagePullSecret" }}'}]{{ else }}[]{{ end }}
        # Hub API mode: authorization decisions come from the hub at hubUrl, never from a
        # database connection, so this child never receives RYVN_DATABASE_URL.
        env:
          - name: AUTHORIZATION_MODE
            value: hub
          - name: RYVN_HUB_URL
            value: '{{ input "hubUrl" }}'
          - name: RYVN_HUB_SERVICE_ACCOUNT_FILE
            value: /app/conf/hub/service-account.json
          - name: ZITADEL_APPLICATION_ACCOUNT_FILE
            value: /app/conf/zitadel/application-account.json
          - name: AUTH_NEGATIVE_CACHE_TTL_SECONDS
            value: "30"
          - name: ZITADEL_DOMAIN
            valueFrom:
              secretKeyRef:
                name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
                key: domain
          - name: ZITADEL_RYVN_PROJECT_ID
            valueFrom:
              secretKeyRef:
                name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
                key: projectId
        volumeMounts:
          - name: zitadel-application-account
            mountPath: /app/conf/zitadel
            readOnly: true
          - name: hub-service-account
            mountPath: /app/conf/hub
            readOnly: true
        volumes:
          # Token introspection uses the ZITADEL application account; hub authorization
          # calls use a separate machine account bound to the hub's authz-gateway role.
          - name: zitadel-application-account
            secret:
              secretName: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              items:
                - key: authProxyApplicationAccountJson
                  path: application-account.json
          - name: hub-service-account
            secret:
              secretName: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              items:
                - key: authProxyServiceAccountJson
                  path: service-account.json
    - service: auth-proxy
      name: '{{ ParentInstallationName }}-auth-proxy'
      alias: auth-proxy
      namespace: observability
      condition: '{{ and (eq EnvironmentProviderType "gcp") (eq (input "provisioningMode") "dedicated") }}'
      serviceUser:
        credentialType: machine-key
        enabled: true
        role: authz-gateway
        secretName: auth-proxy-service-account
      secrets:
        - name: datasource
          values:
            - key: secret
              valueFromInput: datasourceSecret
      config: |
        replicaCount: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        imagePullSecrets: {{ if input "authProxyImagePullSecret" }}[{name: '{{ input "authProxyImagePullSecret" }}'}]{{ else }}[]{{ end }}
        hostingEnvironmentName: '{{ EnvironmentName }}'
        # Hub API mode: authorization decisions come from the managing hub's API, never
        # from a database connection, so this child never receives RYVN_DATABASE_URL.
        env:
          - name: AUTHORIZATION_MODE
            value: hub
          - name: RYVN_HUB_URL
            value: '{{ if input "hubUrl" }}{{ input "hubUrl" }}{{ else }}{{ Hub "apiUrl" }}{{ end }}'
          - name: RYVN_HUB_SERVICE_ACCOUNT_FILE
            value: /app/conf/hub/service-account.json
          - name: AUTH_TOKEN_VERIFICATION
            value: jwt
          - name: AUTH_NEGATIVE_CACHE_TTL_SECONDS
            value: "30"
          # The hub issuer URL is https://<zitadel-domain>; ZITADEL_DOMAIN is the host part.
          - name: ZITADEL_DOMAIN
            value: '{{ substring 8 -1 (Hub "issuerUrl") }}'
          - name: ZITADEL_RYVN_PROJECT_ID
            value: '{{ Hub "projectId" }}'
          # The Grafana child's serviceUser.secretName as rendered by the platform
          # (<installation>-<secretName>); renaming either side requires changing both.
          - name: RYVN_EXPECTED_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: '{{ ParentInstallationName }}-grafana-grafana-oauth'
                key: RYVN_CLIENT_ID
          - name: RYVN_DATASOURCE_SECRET_FILE
            value: /app/conf/datasource/secret
        volumeMounts:
          - name: hub-service-account
            mountPath: /app/conf/hub
            readOnly: true
          - name: datasource-secret
            mountPath: /app/conf/datasource
            readOnly: true
        volumes:
          # Hub authorization calls use the machine account bound to the hub's
          # authz-gateway role; Grafana's datasources authenticate as that same identity
          # with the datasource secret.
          - name: hub-service-account
            secret:
              secretName: '{{ k8sSecretName "auth-proxy-service-account" }}'
              items:
                - key: RYVN_SERVICE_ACCOUNT_JSON
                  path: service-account.json
          - name: datasource-secret
            secret:
              secretName: '{{ k8sSecretName "datasource" }}'
              items:
                - key: secret
                  path: secret
    - service: grafana
      name: '{{ ParentInstallationName }}-grafana'
      alias: grafana
      namespace: observability
      condition: '{{ and (eq EnvironmentProviderType "gcp") (eq (input "provisioningMode") "hub") }}'
      secrets:
        - name: grafana-admin
          values:
            - key: admin-password
              valueFromInput: grafanaAdminPassword
        # Only materialized when useExternalGrafanaDatabase is on: keys whose input is
        # disabled are dropped, and a secret with no keys is not created.
        - name: grafana-database
          values:
            - key: url
              valueFromInput: grafanaDatabaseUrl
      config: |
        replicas: 1
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        resources:
          requests:
            cpu: {{ if eq (input "profile") "medium" }}500m{{ else }}100m{{ end }}
            memory: {{ if eq (input "profile") "medium" }}1Gi{{ else }}256Mi{{ end }}
          limits:
            memory: {{ if eq (input "profile") "medium" }}2Gi{{ else }}512Mi{{ end }}
        persistence:
          enabled: false
        env:
          GF_SECURITY_ADMIN_USER: admin
        admin:
          existingSecret: '{{ k8sSecretName "grafana-admin" }}'
          passwordKey: admin-password
        # Credentials never appear in grafana.ini: the chart's assertNoLeakedSecrets guard
        # rejects them there, and the ZITADEL values only exist as Kubernetes secrets.
        envValueFrom:
          {{- if input "useExternalGrafanaDatabase" }}
          GF_DATABASE_URL:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-database" }}'
              key: url
          {{- else }}
          # Grafana only accepts postgres:// URLs, while the postgres blueprint emits
          # postgresql://, so the discrete database settings are used instead.
          GF_DATABASE_HOST:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: endpoint
          GF_DATABASE_NAME:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: databaseName
          GF_DATABASE_USER:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: username
          GF_DATABASE_PASSWORD:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: password
          {{- end }}
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
            secretKeyRef:
              name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              key: grafanaClientId
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
            secretKeyRef:
              name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              key: grafanaClientSecret
          ZITADEL_ISSUER_URL:
            secretKeyRef:
              name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              key: issuerUrl
        grafana.ini:
          server:
            root_url: https://grafana.{{ input "domain" }}
          database:
            type: postgres
            ssl_mode: require
          users:
            allow_sign_up: false
            allow_org_create: true
            auto_assign_org: false
          auth.generic_oauth:
            enabled: true
            name: Ryvn
            allow_sign_up: true
            scopes: "openid email profile offline_access roles"
            email_attribute_name: "email"
            login_attribute_path: "preferred_username"
            name_attribute_path: "name"
            tls_skip_verify_insecure: false
            auth_url: "$__env{ZITADEL_ISSUER_URL}/oauth/v2/authorize"
            token_url: "$__env{ZITADEL_ISSUER_URL}/oauth/v2/token"
            api_url: "http://{{ ParentInstallationName }}-auth-proxy.observability.svc.cluster.local:9545/userinfo"
            org_attribute_path: ryvn_orgs
            {{- if input "hubOrgs" }}
            org_mapping: '{{ range $hubOrgId, $grafanaOrgId := input "hubOrgs" }}{{ $hubOrgId }}:{{ $grafanaOrgId }}:Editor {{ end }}'
            {{- end }}
            use_pkce: true
            use_refresh_token: true
        ingress:
          enabled: true
          ingressClassName: '{{ input "ingressClassName" }}'
          annotations:
            cert-manager.io/cluster-issuer: '{{ input "clusterIssuer" }}'
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
          hosts:
            - grafana.{{ input "domain" }}
          tls:
            - secretName: '{{ ParentInstallationName }}-grafana-tls'
              hosts:
                - grafana.{{ input "domain" }}
    - service: grafana
      name: '{{ ParentInstallationName }}-grafana'
      alias: grafana
      namespace: observability
      condition: '{{ and (eq EnvironmentProviderType "gcp") (eq (input "provisioningMode") "dedicated") }}'
      serviceUser:
        credentialType: oidc-web-app
        enabled: true
        secretName: grafana-oauth
        redirectUris:
          - '{{ if eq (input "grafanaExposure") "private" }}https://grafana.{{ EnvironmentInternalDomain }}{{ else }}https://grafana.{{ input "domain" }}{{ end }}/login/generic_oauth'
      lifecycle:
        postInstall:
          - run: '{{ ParentInstallationName }}-grafana-bootstrap'
        postUpgrade:
          - run: '{{ ParentInstallationName }}-grafana-bootstrap'
      secrets:
        - name: grafana-admin
          values:
            - key: admin-password
              valueFromInput: grafanaAdminPassword
        - name: grafana-datasource
          values:
            - key: secret
              valueFromInput: datasourceSecret
        # Only materialized when useExternalGrafanaDatabase is on: keys whose input is
        # disabled are dropped, and a secret with no keys is not created.
        - name: grafana-database
          values:
            - key: url
              valueFromInput: grafanaDatabaseUrl
      config: |
        replicas: 1
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        resources:
          requests:
            cpu: {{ if eq (input "profile") "medium" }}500m{{ else }}100m{{ end }}
            memory: {{ if eq (input "profile") "medium" }}1Gi{{ else }}256Mi{{ end }}
          limits:
            memory: {{ if eq (input "profile") "medium" }}2Gi{{ else }}512Mi{{ end }}
        persistence:
          enabled: false
        env:
          GF_SECURITY_ADMIN_USER: admin
        admin:
          existingSecret: '{{ k8sSecretName "grafana-admin" }}'
          passwordKey: admin-password
        # Credentials never appear in grafana.ini or the datasource file: the chart's
        # assertNoLeakedSecrets guard rejects them in grafana.ini, so they are substituted
        # from environment variables backed by Kubernetes secrets.
        envValueFrom:
          {{- if input "useExternalGrafanaDatabase" }}
          GF_DATABASE_URL:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-database" }}'
              key: url
          {{- else }}
          # Grafana only accepts postgres:// URLs, while the postgres blueprint emits
          # postgresql://, so the discrete database settings are used instead.
          GF_DATABASE_HOST:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: endpoint
          GF_DATABASE_NAME:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: databaseName
          GF_DATABASE_USER:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: username
          GF_DATABASE_PASSWORD:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: password
          {{- end }}
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-oauth" }}'
              key: RYVN_CLIENT_ID
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-oauth" }}'
              key: RYVN_CLIENT_SECRET
          RYVN_DATASOURCE_SECRET:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-datasource" }}'
              key: secret
        # Both datasources live in organization 1, the only organization of this stack,
        # and query the owning organization's tenant through the auth-proxy. Basic auth
        # identifies Grafana itself for scheduled work (alerting, recorded queries);
        # the signed-in user's token is passed through for interactive queries.
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                uid: ryvn-loki
                type: loki
                access: proxy
                orgId: 1
                url: https://loki.{{ input "domain" }}
                basicAuth: true
                basicAuthUser: grafana
                editable: false
                jsonData:
                  httpHeaderName1: X-Scope-OrgID
                  oauthPassThru: true
                secureJsonData:
                  httpHeaderValue1: '{{ EnvironmentOrgId }}'
                  basicAuthPassword: $RYVN_DATASOURCE_SECRET
              - name: Mimir
                uid: ryvn-mimir
                type: prometheus
                access: proxy
                orgId: 1
                url: https://mimir.{{ input "domain" }}/prometheus
                basicAuth: true
                basicAuthUser: grafana
                editable: false
                isDefault: true
                jsonData:
                  httpHeaderName1: X-Scope-OrgID
                  oauthPassThru: true
                  prometheusType: Mimir
                secureJsonData:
                  httpHeaderValue1: '{{ EnvironmentOrgId }}'
                  basicAuthPassword: $RYVN_DATASOURCE_SECRET
        grafana.ini:
          server:
            root_url: {{ if eq (input "grafanaExposure") "private" }}https://grafana.{{ EnvironmentInternalDomain }}{{ else }}https://grafana.{{ input "domain" }}{{ end }}
          database:
            type: postgres
            ssl_mode: require
          users:
            allow_sign_up: false
            allow_org_create: true
            auto_assign_org: false
          auth.generic_oauth:
            enabled: true
            name: Ryvn
            allow_sign_up: true
            scopes: "openid email profile offline_access roles"
            email_attribute_name: "email"
            login_attribute_path: "preferred_username"
            name_attribute_path: "name"
            tls_skip_verify_insecure: false
            auth_url: "{{ Hub "issuerUrl" }}/oauth/v2/authorize"
            token_url: "{{ Hub "issuerUrl" }}/oauth/v2/token"
            api_url: "http://{{ ParentInstallationName }}-auth-proxy.observability.svc.cluster.local:9545/userinfo"
            # Only members of the organization owning this installation may sign in; they
            # land in organization 1 as Editors. Strict mode refuses everyone else.
            org_attribute_path: ryvn_orgs
            org_mapping: '{{ EnvironmentOrgId }}:1:Editor'
            role_attribute_strict: true
            skip_org_role_sync: false
            use_pkce: true
            use_refresh_token: true
        ingress:
          enabled: true
          ingressClassName: '{{ if eq (input "grafanaExposure") "private" }}internal-nginx{{ else }}{{ input "ingressClassName" }}{{ end }}'
          annotations:
            cert-manager.io/cluster-issuer: '{{ input "clusterIssuer" }}'
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
          hosts:
            - {{ if eq (input "grafanaExposure") "private" }}grafana.{{ EnvironmentInternalDomain }}{{ else }}grafana.{{ input "domain" }}{{ end }}
          tls:
            - secretName: '{{ ParentInstallationName }}-grafana-tls'
              hosts:
                - {{ if eq (input "grafanaExposure") "private" }}grafana.{{ EnvironmentInternalDomain }}{{ else }}grafana.{{ input "domain" }}{{ end }}
    # Grafana's initial organization is created as "Main Org." and static provisioning
    # cannot rename it, so this job sets the display name through the API after Grafana
    # is up. It is triggered by the Grafana child's lifecycle hooks and by changes to
    # its own inputs, and re-running it is a no-op.
    - service: grafana-org-bootstrap
      name: '{{ ParentInstallationName }}-grafana-bootstrap'
      alias: grafana-bootstrap
      namespace: observability
      condition: '{{ and (eq EnvironmentProviderType "gcp") (eq (input "provisioningMode") "dedicated") }}'
      lifecycle:
        postUpdate:
          - run: '{{ ParentInstallationName }}-grafana-bootstrap'
      env:
        - key: GRAFANA_URL
          value: 'http://{{ ParentInstallationName }}-grafana.observability.svc.cluster.local:80'
        - key: GRAFANA_ADMIN_USER
          value: admin
        - key: GRAFANA_ADMIN_PASSWORD
          isSecret: true
          valueFromInput:
            name: grafanaAdminPassword
        - key: ORG_DISPLAY_NAME
          value: '{{ if input "organizationDisplayName" }}{{ input "organizationDisplayName" }}{{ else }}{{ EnvironmentOrgId }}{{ end }}'
      config: |
        concurrencyPolicy: Forbid
        backoffLimit: 3
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 3
        ttlSecondsAfterFinished: 86400
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        command: ["/bin/sh", "-ec"]
        args:
          - |
            for i in $(seq 1 60); do
              if curl -fsS "$GRAFANA_URL/api/health" >/dev/null; then break; fi
              if [ "$i" -eq 60 ]; then echo "grafana not healthy after 60 attempts" >&2; exit 1; fi
              sleep 5
            done
            payload=$(printf '{"name":"%s"}' "$(printf '%s' "$ORG_DISPLAY_NAME" | sed 's/\\/\\\\/g; s/"/\\"/g')")
            curl -fsS -X PUT -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
              -H 'Content-Type: application/json' \
              --data "$payload" "$GRAFANA_URL/api/orgs/1"
            echo
    - blueprint: postgres
      name: '{{ ParentInstallationName }}-db'
      alias: grafana-db
      condition: '{{ not (input "useExternalGrafanaDatabase") }}'
      inputs:
        - name: databaseName
          value: grafana
        - name: username
          value: grafana
        - name: size
          value: small
        - name: enableReadOnlyUser
          value: false
        - name: enableMetrics
          value: false
        - name: deletionProtection
          valueFromInput:
            name: deletionProtection
  distribution: internal-managed
