    - service: auth-proxy
      name: '{{ ParentInstallationName }}-auth-proxy'
      alias: auth-proxy
      namespace: observability
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "hub") }}'
      config: |
        replicaCount: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        {{- if input "tolerations" | trim }}
        tolerations:{{ input "tolerations" | nindent 2 }}
        {{- end }}
        # Hub API mode: authorization decisions come from the hub at hubUrl, never from a
        # database connection, so this child never receives RYVN_DATABASE_URL.
        env:
          - name: AUTHORIZATION_MODE
            value: hub
          - name: RYVN_HUB_URL
            value: '{{ input "hubUrl" }}'
          - name: RYVN_HUB_SERVICE_ACCOUNT_FILE
            value: /app/conf/hub/service-account.json
          - name: ZITADEL_APPLICATION_ACCOUNT_FILE
            value: /app/conf/zitadel/application-account.json
          - name: AUTH_NEGATIVE_CACHE_TTL_SECONDS
            value: "30"
          - name: ZITADEL_DOMAIN
            valueFrom:
              secretKeyRef:
                name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
                key: domain
          - name: ZITADEL_RYVN_PROJECT_ID
            valueFrom:
              secretKeyRef:
                name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
                key: projectId
        volumeMounts:
          - name: zitadel-application-account
            mountPath: /app/conf/zitadel
            readOnly: true
          - name: hub-service-account
            mountPath: /app/conf/hub
            readOnly: true
        volumes:
          # Token introspection uses the ZITADEL application account; hub authorization
          # calls use a separate machine account bound to the hub's authz-gateway role.
          - name: zitadel-application-account
            secret:
              secretName: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              items:
                - key: authProxyApplicationAccountJson
                  path: application-account.json
          - name: hub-service-account
            secret:
              secretName: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              items:
                - key: authProxyServiceAccountJson
                  path: service-account.json
    - service: auth-proxy
      name: '{{ ParentInstallationName }}-auth-proxy'
      alias: auth-proxy
      namespace: observability
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "dedicated") }}'
      serviceUser:
        credentialType: machine-key
        enabled: true
        role: authz-gateway
        secretName: auth-proxy-service-account
      secrets:
        - name: datasource
          values:
            - key: secret
              valueFromInput: datasourceSecret
      config: |
        replicaCount: {{ if eq (input "profile") "medium" }}2{{ else }}1{{ end }}
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        {{- if input "tolerations" | trim }}
        tolerations:{{ input "tolerations" | nindent 2 }}
        {{- end }}
        hostingEnvironmentName: '{{ EnvironmentName }}'
        # Hub API mode: authorization decisions come from the managing hub's API, never
        # from a database connection, so this child never receives RYVN_DATABASE_URL.
        env:
          - name: AUTHORIZATION_MODE
            value: hub
          - name: RYVN_HUB_URL
            value: '{{ if input "hubUrl" }}{{ input "hubUrl" }}{{ else }}{{ Hub "apiUrl" }}{{ end }}'
          - name: RYVN_HUB_SERVICE_ACCOUNT_FILE
            value: /app/conf/hub/service-account.json
          - name: AUTH_TOKEN_VERIFICATION
            value: jwt
          - name: AUTH_NEGATIVE_CACHE_TTL_SECONDS
            value: "30"
          # The hub issuer URL is https://<zitadel-domain>; ZITADEL_DOMAIN is the host part.
          - name: ZITADEL_DOMAIN
            value: '{{ substring 8 -1 (Hub "issuerUrl") }}'
          - name: ZITADEL_RYVN_PROJECT_ID
            value: '{{ Hub "projectId" }}'
          # The Grafana child's serviceUser.secretName as rendered by the platform
          # (<installation>-<secretName>); renaming either side requires changing both.
          - name: RYVN_EXPECTED_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: '{{ ParentInstallationName }}-grafana-grafana-oauth'
                key: RYVN_CLIENT_ID
          - name: RYVN_DATASOURCE_SECRET_FILE
            value: /app/conf/datasource/secret
        volumeMounts:
          - name: hub-service-account
            mountPath: /app/conf/hub
            readOnly: true
          - name: datasource-secret
            mountPath: /app/conf/datasource
            readOnly: true
        volumes:
          # Hub authorization calls use the machine account bound to the hub's
          # authz-gateway role; Grafana's datasources authenticate as that same identity
          # with the datasource secret.
          - name: hub-service-account
            secret:
              secretName: '{{ k8sSecretName "auth-proxy-service-account" }}'
              items:
                - key: RYVN_SERVICE_ACCOUNT_JSON
                  path: service-account.json
          - name: datasource-secret
            secret:
              secretName: '{{ k8sSecretName "datasource" }}'
              items:
                - key: secret
                  path: secret
    - service: grafana
      name: '{{ ParentInstallationName }}-grafana'
      alias: grafana
      namespace: observability
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "hub") }}'
      secrets:
        - name: grafana-admin
          values:
            - key: admin-password
              valueFromInput: grafanaAdminPassword
        # Only materialized when useExternalGrafanaDatabase is on: keys whose input is
        # disabled are dropped, and a secret with no keys is not created.
        - name: grafana-database
          values:
            - key: url
              valueFromInput: grafanaDatabaseUrl
      config: |
        replicas: 1
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        {{- if input "tolerations" | trim }}
        tolerations:{{ input "tolerations" | nindent 2 }}
        {{- end }}
        resources:
          requests:
            cpu: {{ if eq (input "profile") "medium" }}500m{{ else }}100m{{ end }}
            memory: {{ if eq (input "profile") "medium" }}1Gi{{ else }}256Mi{{ end }}
          limits:
            memory: {{ if eq (input "profile") "medium" }}2Gi{{ else }}512Mi{{ end }}
        persistence:
          enabled: false
        env:
          GF_SECURITY_ADMIN_USER: admin
        admin:
          existingSecret: '{{ k8sSecretName "grafana-admin" }}'
          passwordKey: admin-password
        # Credentials never appear in grafana.ini: the chart's assertNoLeakedSecrets guard
        # rejects them there, and the ZITADEL values only exist as Kubernetes secrets.
        envValueFrom:
          {{- if input "useExternalGrafanaDatabase" }}
          GF_DATABASE_URL:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-database" }}'
              key: url
          {{- else }}
          # Grafana only accepts postgres:// URLs, while the postgres blueprint emits
          # postgresql://, so the discrete database settings are used instead.
          GF_DATABASE_HOST:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: endpoint
          GF_DATABASE_NAME:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: databaseName
          GF_DATABASE_USER:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: username
          GF_DATABASE_PASSWORD:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: password
          {{- end }}
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
            secretKeyRef:
              name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              key: grafanaClientId
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
            secretKeyRef:
              name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              key: grafanaClientSecret
          ZITADEL_ISSUER_URL:
            secretKeyRef:
              name: '{{ (blueprintInstallation "zitadel").outputsSecret }}'
              key: issuerUrl
        grafana.ini:
          server:
            root_url: https://grafana.{{ input "domain" }}
          database:
            type: postgres
            ssl_mode: require
          users:
            allow_sign_up: false
            allow_org_create: true
            auto_assign_org: false
          auth.generic_oauth:
            enabled: true
            name: Ryvn
            allow_sign_up: true
            scopes: "openid email profile offline_access roles"
            email_attribute_name: "email"
            login_attribute_path: "preferred_username"
            name_attribute_path: "name"
            tls_skip_verify_insecure: false
            auth_url: "$__env{ZITADEL_ISSUER_URL}/oauth/v2/authorize"
            token_url: "$__env{ZITADEL_ISSUER_URL}/oauth/v2/token"
            api_url: "http://{{ ParentInstallationName }}-auth-proxy.observability.svc.cluster.local:9545/userinfo"
            org_attribute_path: ryvn_orgs
            {{- if input "hubOrgs" }}
            org_mapping: '{{ range $hubOrgId, $grafanaOrgId := input "hubOrgs" }}{{ $hubOrgId }}:{{ $grafanaOrgId }}:Editor {{ end }}'
            {{- end }}
            use_pkce: true
            use_refresh_token: true
        ingress:
          enabled: {{ input "ingressEnabled" }}
          ingressClassName: '{{ input "ingressClassName" }}'
          annotations:
            cert-manager.io/cluster-issuer: '{{ input "clusterIssuer" }}'
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
          hosts:
            - grafana.{{ input "domain" }}
          tls:
            - secretName: '{{ ParentInstallationName }}-grafana-tls'
              hosts:
                - grafana.{{ input "domain" }}
    - service: grafana
      name: '{{ ParentInstallationName }}-grafana'
      alias: grafana
      namespace: observability
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "dedicated") }}'
      serviceUser:
        credentialType: oidc-web-app
        enabled: true
        secretName: grafana-oauth
        redirectUris:
          - '{{ if and (eq (input "exposure") "private") (input "exposeToTailnet") }}https://{{ input "tailnetHostnamePrefix" }}-grafana.{{ input "tailnetDomain" }}{{ else if or (eq (input "exposure") "private") (eq (input "grafanaExposure") "private") }}https://grafana.{{ EnvironmentInternalDomain }}{{ else }}https://grafana.{{ input "domain" }}{{ end }}/login/generic_oauth'
      lifecycle:
        postInstall:
          - run: '{{ ParentInstallationName }}-grafana-bootstrap'
        postUpgrade:
          - run: '{{ ParentInstallationName }}-grafana-bootstrap'
      secrets:
        - name: grafana-admin
          values:
            - key: admin-password
              valueFromInput: grafanaAdminPassword
        - name: grafana-datasource
          values:
            - key: secret
              valueFromInput: datasourceSecret
        # Only materialized when useExternalGrafanaDatabase is on: keys whose input is
        # disabled are dropped, and a secret with no keys is not created.
        - name: grafana-database
          values:
            - key: url
              valueFromInput: grafanaDatabaseUrl
      config: |
        replicas: 1
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        {{- if input "tolerations" | trim }}
        tolerations:{{ input "tolerations" | nindent 2 }}
        {{- end }}
        resources:
          requests:
            cpu: {{ if eq (input "profile") "medium" }}500m{{ else }}100m{{ end }}
            memory: {{ if eq (input "profile") "medium" }}1Gi{{ else }}256Mi{{ end }}
          limits:
            memory: {{ if eq (input "profile") "medium" }}2Gi{{ else }}512Mi{{ end }}
        persistence:
          enabled: false
        env:
          GF_SECURITY_ADMIN_USER: admin
        admin:
          existingSecret: '{{ k8sSecretName "grafana-admin" }}'
          passwordKey: admin-password
        # Credentials never appear in grafana.ini or the datasource file: the chart's
        # assertNoLeakedSecrets guard rejects them in grafana.ini, so they are substituted
        # from environment variables backed by Kubernetes secrets.
        envValueFrom:
          {{- if input "useExternalGrafanaDatabase" }}
          GF_DATABASE_URL:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-database" }}'
              key: url
          {{- else }}
          # Grafana only accepts postgres:// URLs, while the postgres blueprint emits
          # postgresql://, so the discrete database settings are used instead.
          GF_DATABASE_HOST:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: endpoint
          GF_DATABASE_NAME:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: databaseName
          GF_DATABASE_USER:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: username
          GF_DATABASE_PASSWORD:
            secretKeyRef:
              name: '{{ (blueprintInstallation "grafana-db").outputsSecret }}'
              key: password
          {{- end }}
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-oauth" }}'
              key: RYVN_CLIENT_ID
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-oauth" }}'
              key: RYVN_CLIENT_SECRET
          RYVN_DATASOURCE_SECRET:
            secretKeyRef:
              name: '{{ k8sSecretName "grafana-datasource" }}'
              key: secret
        # Both datasources live in organization 1, the only organization of this stack,
        # and query the owning organization's tenant through the auth-proxy. Basic auth
        # identifies Grafana itself for scheduled work (alerting, recorded queries);
        # the signed-in user's token is passed through for interactive queries.
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                uid: ryvn-loki
                type: loki
                access: proxy
                orgId: 1
                url: {{ if eq (input "exposure") "private" }}http://{{ ParentInstallationName }}-loki-svc-gateway.observability.svc.cluster.local{{ else }}https://loki.{{ input "domain" }}{{ end }}
                basicAuth: true
                basicAuthUser: grafana
                editable: false
                jsonData:
                  httpHeaderName1: X-Scope-OrgID
                  oauthPassThru: true
                secureJsonData:
                  httpHeaderValue1: '{{ EnvironmentOrgId }}'
                  basicAuthPassword: $RYVN_DATASOURCE_SECRET
              - name: Mimir
                uid: ryvn-mimir
                type: prometheus
                access: proxy
                orgId: 1
                url: {{ if eq (input "exposure") "private" }}http://{{ ParentInstallationName }}-mimir-svc-gateway.observability.svc.cluster.local{{ else }}https://mimir.{{ input "domain" }}{{ end }}/prometheus
                basicAuth: true
                basicAuthUser: grafana
                editable: false
                isDefault: true
                jsonData:
                  httpHeaderName1: X-Scope-OrgID
                  oauthPassThru: true
                  prometheusType: Mimir
                secureJsonData:
                  httpHeaderValue1: '{{ EnvironmentOrgId }}'
                  basicAuthPassword: $RYVN_DATASOURCE_SECRET
        grafana.ini:
          server:
            root_url: {{ if and (eq (input "exposure") "private") (input "exposeToTailnet") }}https://{{ input "tailnetHostnamePrefix" }}-grafana.{{ input "tailnetDomain" }}{{ else if or (eq (input "exposure") "private") (eq (input "grafanaExposure") "private") }}https://grafana.{{ EnvironmentInternalDomain }}{{ else }}https://grafana.{{ input "domain" }}{{ end }}
          database:
            type: postgres
            ssl_mode: require
          users:
            allow_sign_up: false
            allow_org_create: true
            auto_assign_org: false
          auth.generic_oauth:
            enabled: true
            name: Ryvn
            allow_sign_up: true
            scopes: "openid email profile offline_access roles"
            email_attribute_name: "email"
            login_attribute_path: "preferred_username"
            name_attribute_path: "name"
            tls_skip_verify_insecure: false
            auth_url: "{{ Hub "issuerUrl" }}/oauth/v2/authorize"
            token_url: "{{ Hub "issuerUrl" }}/oauth/v2/token"
            api_url: "http://{{ ParentInstallationName }}-auth-proxy.observability.svc.cluster.local:9545/userinfo"
            # Grafana roles derive from the caller's organization-level Ryvn role in the
            # organization owning this installation, as reported by the auth-proxy's
            # /userinfo `ryvn_org_roles` claim ("<orgId>/<role>"): admin -> Admin,
            # developer -> Editor, operator/viewer -> Viewer. The membership-only `member`
            # role, roles held only on an environment/service, roles in other organizations
            # and subjects without bindings match nothing; strict mode then refuses login.
            # No role_attribute_path is set (Grafana would take the higher of the two), and
            # Grafana server admin is never assigned.
            org_attribute_path: ryvn_org_roles
            org_mapping: '{{ EnvironmentOrgId }}/admin:1:Admin {{ EnvironmentOrgId }}/developer:1:Editor {{ EnvironmentOrgId }}/operator:1:Viewer {{ EnvironmentOrgId }}/viewer:1:Viewer'
            role_attribute_strict: true
            allow_assign_grafana_admin: false
            skip_org_role_sync: false
            use_pkce: true
            use_refresh_token: true
        ingress:
          enabled: {{ and (input "ingressEnabled") (not (and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private"))) }}
          ingressClassName: '{{ if eq (input "grafanaExposure") "private" }}internal-nginx{{ else }}{{ input "ingressClassName" }}{{ end }}'
          annotations:
            cert-manager.io/cluster-issuer: '{{ input "clusterIssuer" }}'
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
          hosts:
            - {{ if eq (input "grafanaExposure") "private" }}grafana.{{ EnvironmentInternalDomain }}{{ else }}grafana.{{ input "domain" }}{{ end }}
          tls:
            - secretName: '{{ ParentInstallationName }}-grafana-tls'
              hosts:
                - {{ if eq (input "grafanaExposure") "private" }}grafana.{{ EnvironmentInternalDomain }}{{ else }}grafana.{{ input "domain" }}{{ end }}
    # Grafana's initial organization is created as "Main Org." and static provisioning
    # cannot rename it, so this job sets the display name through the API after Grafana
    # is up. It is triggered by the Grafana child's lifecycle hooks and by changes to
    # its own inputs, and re-running it is a no-op.
    - service: grafana-org-bootstrap
      name: '{{ ParentInstallationName }}-grafana-bootstrap'
      alias: grafana-bootstrap
      namespace: observability
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "dedicated") }}'
      lifecycle:
        postUpdate:
          - run: '{{ ParentInstallationName }}-grafana-bootstrap'
      env:
        - key: GRAFANA_URL
          value: 'http://{{ ParentInstallationName }}-grafana.observability.svc.cluster.local:80'
        - key: GRAFANA_ADMIN_USER
          value: admin
        - key: GRAFANA_ADMIN_PASSWORD
          isSecret: true
          valueFromInput:
            name: grafanaAdminPassword
        - key: ORG_DISPLAY_NAME
          value: '{{ if input "organizationDisplayName" }}{{ input "organizationDisplayName" }}{{ else }}{{ EnvironmentOrgId }}{{ end }}'
      config: |
        concurrencyPolicy: Forbid
        backoffLimit: 3
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 3
        ttlSecondsAfterFinished: 86400
        nodeSelector: {{ if input "nodeGroup" }}{ryvn.app/node-group-name: '{{ input "nodeGroup" }}'}{{ else }}{}{{ end }}
        {{- if input "tolerations" | trim }}
        tolerations:{{ input "tolerations" | nindent 2 }}
        {{- end }}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        command: ["/bin/sh", "-ec"]
        args:
          - |
            for i in $(seq 1 60); do
              if curl -fsS "$GRAFANA_URL/api/health" >/dev/null; then break; fi
              if [ "$i" -eq 60 ]; then echo "grafana not healthy after 60 attempts" >&2; exit 1; fi
              sleep 5
            done
            payload=$(printf '{"name":"%s"}' "$(printf '%s' "$ORG_DISPLAY_NAME" | sed 's/\\/\\\\/g; s/"/\\"/g')")
            curl -fsS -X PUT -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
              -H 'Content-Type: application/json' \
              --data "$payload" "$GRAFANA_URL/api/orgs/1"
            echo
    # HTTPS keeps Grafana's canonical URL and OAuth callback on the operator's
    # TLS endpoint. Loki/Mimir still pass through tenant auth.
    - service: tailscale-resources
      name: '{{ ParentInstallationName }}-ts'
      alias: tailscale
      namespace: observability
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") (input "exposeToTailnet") }}'
      config: |
        proxyGroups:
          {{- if input "tailnetProxyGroup" }}
          []
          {{- else }}
          - name: '{{ input "tailnetHostnamePrefix" }}-ingress'
            spec:
              type: ingress
              replicas: 2
              proxyClass: '{{ if input "tailnetProxyClass" }}{{ input "tailnetProxyClass" }}{{ else }}{{ input "tailnetHostnamePrefix" }}-ingress{{ end }}'
          {{- end }}
        proxyClasses:
          {{- if or (input "tailnetProxyGroup") (input "tailnetProxyClass") }}
          []
          {{- else }}
          - name: '{{ input "tailnetHostnamePrefix" }}-ingress'
            spec:
              statefulSet:
                pod:
                  labels:
                    ryvn.app/tailnet-proxy-group: '{{ input "tailnetHostnamePrefix" }}-ingress'
                  affinity:
                    podAntiAffinity:
                      preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            topologyKey: kubernetes.io/hostname
                            labelSelector:
                              matchLabels:
                                ryvn.app/tailnet-proxy-group: '{{ input "tailnetHostnamePrefix" }}-ingress'
          {{- end }}
        ingresses:
          - name: '{{ ParentInstallationName }}-loki'
            annotations:
              tailscale.com/proxy-group: '{{ or (input "tailnetProxyGroup") (printf "%s-ingress" (input "tailnetHostnamePrefix")) }}'
            hosts:
              - host: '{{ input "tailnetHostnamePrefix" }}-loki.{{ input "tailnetDomain" }}'
                paths:
                  - path: /
                    service:
                      name: '{{ ParentInstallationName }}-loki-svc-gateway'
                      port: 80
          - name: '{{ ParentInstallationName }}-mimir'
            annotations:
              tailscale.com/proxy-group: '{{ or (input "tailnetProxyGroup") (printf "%s-ingress" (input "tailnetHostnamePrefix")) }}'
            hosts:
              - host: '{{ input "tailnetHostnamePrefix" }}-mimir.{{ input "tailnetDomain" }}'
                paths:
                  - path: /
                    service:
                      name: '{{ ParentInstallationName }}-mimir-svc-gateway'
                      port: 80
          - name: '{{ ParentInstallationName }}-grafana'
            annotations:
              tailscale.com/proxy-group: '{{ or (input "tailnetProxyGroup") (printf "%s-ingress" (input "tailnetHostnamePrefix")) }}'
            hosts:
              - host: '{{ input "tailnetHostnamePrefix" }}-grafana.{{ input "tailnetDomain" }}'
                paths:
                  - path: /
                    service:
                      name: '{{ ParentInstallationName }}-grafana'
                      port: 80
    - service: ryvn-routes
      name: '{{ ParentInstallationName }}-routes'
      alias: routes
      namespace: observability
      condition: '{{ and (or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure")) (or (input "routesEnabled") (and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private"))) }}'
      config: |
        routes:
          - name: '{{ ParentInstallationName }}-loki'
            spec:
              exposure: [{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}internal{{ else }}public{{ end }}]
              domains:
                - 'loki.{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}{{ EnvironmentInternalDomain }}{{ else }}{{ input "domain" }}{{ end }}'
              rules:
                - path: /
                  to:
                    - name: '{{ ParentInstallationName }}-loki-svc-gateway'
                      port: 80
          - name: '{{ ParentInstallationName }}-mimir'
            spec:
              exposure: [{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}internal{{ else }}public{{ end }}]
              domains:
                - 'mimir.{{ if and (eq (input "provisioningMode") "dedicated") (eq (input "exposure") "private") }}{{ EnvironmentInternalDomain }}{{ else }}{{ input "domain" }}{{ end }}'
              rules:
                - path: /
                  to:
                    - name: '{{ ParentInstallationName }}-mimir-svc-gateway'
                      port: 80
          - name: '{{ ParentInstallationName }}-grafana'
            spec:
              {{- if and (eq (input "provisioningMode") "dedicated") (or (eq (input "exposure") "private") (eq (input "grafanaExposure") "private")) }}
              exposure: [internal]
              domains:
                - 'grafana.{{ EnvironmentInternalDomain }}'
              {{- else }}
              exposure: [public]
              domains:
                - 'grafana.{{ input "domain" }}'
              {{- end }}
              rules:
                - path: /
                  to:
                    - name: '{{ ParentInstallationName }}-grafana'
                      port: 80
    - blueprint: postgres
      name: '{{ ParentInstallationName }}-db'
      alias: grafana-db
      condition: '{{ not (input "useExternalGrafanaDatabase") }}'
      inputs:
        - name: nodeGroup
          valueFromInput:
            name: nodeGroup
        - name: tolerations
          valueFromInput:
            name: tolerations
        - name: databaseName
          value: grafana
        - name: username
          value: grafana
        - name: size
          value: small
        - name: enableReadOnlyUser
          value: false
        - name: enableMetrics
          value: false
        - name: deletionProtection
          valueFromInput:
            name: deletionProtection
  distribution: marketplace-managed
