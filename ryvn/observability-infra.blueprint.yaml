      namespace: observability
      condition: '{{ or (eq EnvironmentProviderType "gcp") (eq EnvironmentProviderType "aws") (eq EnvironmentProviderType "azure") }}'
      config: |
        serviceAccount:
          create: true
          name: mimir
          {{- if eq EnvironmentProviderType "azure" }}
          # The client-id reference orders this install after the managed identity and its role assignments have applied.
          annotations:
            azure.workload.identity/client-id: '{{ (serviceInstallation "mimir-azure-access").outputs.client_ids.mimir }}'
        global:
          podLabels:
            azure.workload.identity/use: "true"
          {{- end }}
        {{- if eq EnvironmentProviderType "gcp" }}
        global:
          # Referencing the access binding orders this install after the bucket IAM binding has applied.
          podAnnotations:
            ryvn.app/workload-access-project-number: '{{ (serviceInstallation "mimir-access").outputs.project_number }}'
        {{- else if eq EnvironmentProviderType "aws" }}
        global:
          # Referencing the access role orders this install after the Pod Identity association has applied.
          podAnnotations:
            ryvn.app/workload-access-role-arn: '{{ (serviceInstallation "mimir-access").outputs.role_arns.mimir }}'
        {{- end }}
        mimir:
          structuredConfig:
            multitenancy_enabled: true
            limits:
              compactor_blocks_retention_period: '{{ input "mimirBlockRetentionDays" }}d'
              ingestion_rate: 200000
              max_global_series_per_user: 2000000
              out_of_order_time_window: 10m
            common:
              storage:
                {{- if eq EnvironmentProviderType "gcp" }}
                backend: gcs
                gcs:
                  bucket_name: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
                {{- else if eq EnvironmentProviderType "aws" }}
                # Credentials come from the SDK default chain (EKS Pod Identity); no static keys.
                backend: s3
                s3:
                  endpoint: 's3.{{ .ryvn.env.state.cluster_region }}.amazonaws.com'
                  region: '{{ .ryvn.env.state.cluster_region }}'
                  bucket_name: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
                {{- else if eq EnvironmentProviderType "azure" }}
                backend: azure
                azure:
                  account_name: '{{ (blueprintInstallation "mimir-bucket").outputs.storageAccountName }}'
                  container_name: '{{ (blueprintInstallation "mimir-bucket").outputs.bucketName }}'
                {{- end }}
            blocks_storage:
              backend: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else if eq EnvironmentProviderType "aws" }}s3{{ else if eq EnvironmentProviderType "azure" }}azure{{ end }}
              storage_prefix: blocks
            ruler_storage:
              storage_prefix: ruler
            alertmanager_storage:
              backend: {{ if eq EnvironmentProviderType "gcp" }}gcs{{ else if eq EnvironmentProviderType "aws" }}s3{{ else if eq EnvironmentProviderType "azure" }}azure{{ end }}
              storage_prefix: alertmanager
        minio:
          enabled: false
        nginx:
          enabled: false
        {{- if ne (input "profile") "medium" }}
        chunks-cache:
          enabled: false
        index-cache:
          enabled: false
        metadata-cache:
          enabled: false
        results-cache:
          enabled: false
