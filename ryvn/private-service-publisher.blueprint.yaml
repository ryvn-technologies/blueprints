# yaml-language-server: $schema=https://api.ryvn.app/v1/schemas/resources.json
kind: Blueprint
metadata:
  name: private-service-publisher
spec:
  description: |
    Shares this environment's internal services with other environments over a private link.

    This blueprint is opinionated. It attaches a private link (Private Service Connect on GCP, PrivateLink on AWS, or Azure Private Link) to the internal load balancer in front of Ryvn's managed internal gateway, and the gateway routes each request to a service by hostname. Connected environments call a service at the same internal URL it has here, like `https://<name>.<publisherDomain>`, and traffic stays on the cloud's private network.

    ## Setup

    1. Install this blueprint once, on the environment that runs the services.
    2. Allow the environments that will connect. They must be on the same cloud as this environment, and on GCP in the same region. Environments in this GCP project, AWS account, or Azure subscription are allowed by default. List other projects in `gcpAllowedProjects`, other accounts in `awsAllowedPrincipals`, or other subscriptions in `azureAllowedSubscriptions`. On AWS, list other regions in `awsAllowedConsumerRegions`.
    3. Install Private Service Consumer on each connecting environment with this installation's `publisherId` and `publisherDomain` outputs.

    To add an environment later, allow it here before you install Private Service Consumer there.

    ## Publish a service

    A service is reachable over the link once it has an internal [Route](https://ryvn.ai/docs/networking/routes). Server installations get one for each port automatically. For other installations, like Helm charts, add a Route with `internal` exposure and a name under this environment's internal domain. Each installation lists its URLs under Settings > Networking.

    ## What to expect

    - The link carries HTTP, including gRPC. It doesn't carry other protocols, like direct database connections.
    - Every internal Route here is reachable from every connected environment.
    - Requests arrive from the link's addresses, so services can't tell callers apart by IP. Use authentication to control who can call a service.
    - To disconnect an environment, uninstall Private Service Consumer there, then remove it from the allowed lists. On AWS and Azure, removing it from the lists alone doesn't disconnect it.
    - Uninstall Private Service Consumer everywhere before you uninstall this blueprint or delete this environment.
  displayName: Private Service Publisher
  inputs:
    - name: gcpAllowedProjects
      type: array
      default: []
      description: GCP project IDs allowed to connect. Leave empty to allow only this environment's project. If you set it, list this project too when environments in it connect.
      displayName: Allowed Projects
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
    - name: awsAllowedPrincipals
      type: array
      default: []
      description: AWS principals allowed to connect, such as `arn:aws:iam::123456789012:root` for a whole account. Leave empty to allow only this environment's account. If you set it, list this account too when environments in it connect.
      displayName: Allowed Principals
      condition: '{{ eq EnvironmentProviderType "aws" }}'
    - name: awsAllowedConsumerRegions
      type: array
      default: []
      description: Other AWS regions that connecting environments may be in. This environment's own region is always allowed.
      displayName: Allowed Consumer Regions
      condition: '{{ eq EnvironmentProviderType "aws" }}'
    - name: azureAllowedSubscriptions
      type: array
      default: []
      description: Azure subscription IDs allowed to connect. Leave empty to allow only this environment's subscription. If you set it, list this subscription too when environments in it connect.
      displayName: Allowed Subscriptions
      condition: '{{ eq EnvironmentProviderType "azure" }}'
    - name: gcpNatSubnetCidr
      type: string
      default: 198.18.0.0/28
      description: IPv4 range that incoming connections come from. Must not overlap anything in or routed to this network. Can't be changed after install.
      displayName: NAT Subnet Range
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      immutable: true
  outputs:
    - name: publisherId
      type: string
      from: '{{ if eq EnvironmentProviderType "aws" }}{{ (serviceInstallation "link").outputs.endpoint_service_name }}{{ else if eq EnvironmentProviderType "azure" }}{{ (serviceInstallation "link").outputs.private_link_service_id }}{{ else }}{{ (serviceInstallation "link").outputs.publisher_id }}{{ end }}'
      description: Set as `publisherId` on Private Service Consumer.
      displayName: Publisher ID
    - name: publisherDomain
      type: string
      from: '{{ EnvironmentInternalDomain }}'
      description: Set as `publisherDomain` on Private Service Consumer.
      displayName: Publisher Domain
  # TODO(NominalTrajectory): the published load balancer is intentionally fixed to the managed internal gateway, since
  # the link relies on its port 80 listener and internal DNS. Later, open this up to a custom gateway or Service.
  installations:
    - service: gcp-private-service-publisher
      name: '{{ ParentInstallationName }}'
      alias: link
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "gcp" }}'
      config: |
        project_id: '{{ .ryvn.env.provider.gcp.projectId }}'
        region: '{{ .ryvn.env.state.cluster_region }}'
        network: '{{ .ryvn.env.state.vpc.self_link }}'
        name_prefix: '{{ ParentInstallationName }}'
        nat_subnet_cidr: '{{ input "gcpNatSubnetCidr" }}'
        allowed_projects: {{ input "gcpAllowedProjects" | toJson }}
      releaseChannel: stable
    - service: aws-privatelink-endpoint-service
      name: '{{ ParentInstallationName }}'
      alias: link
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "aws" }}'
      config: |
        region: '{{ .ryvn.env.state.cluster_region }}'
        name_prefix: '{{ ParentInstallationName }}'
        network_load_balancer_tags:
          elbv2.k8s.aws/cluster: '{{ .ryvn.env.state.cluster_name }}'
          service.k8s.aws/stack: ryvn-system/internal-ryvn-istio
        acceptance_required: false
        allowed_principals: {{ input "awsAllowedPrincipals" | toJson }}
        supported_regions: {{ input "awsAllowedConsumerRegions" | toJson }}
      releaseChannel: stable
    - service: azure-private-link-service
      name: '{{ ParentInstallationName }}'
      alias: link
      provisionsInfrastructure: true
      condition: '{{ eq EnvironmentProviderType "azure" }}'
      config: |
        name_prefix: '{{ ParentInstallationName }}'
        location: '{{ .ryvn.env.state.resource_group.location }}'
        resource_group_name: '{{ .ryvn.env.state.resource_group.name }}'
        virtual_network_id: '{{ .ryvn.env.state.vnet.id }}'
        nat_subnet_address_range: '{{ .ryvn.env.state.vnet.service_subnet_pool_cidr }}'
        visibility_subscription_ids: {{ input "azureAllowedSubscriptions" | toJson }}
        auto_approval_subscription_ids: {{ if input "azureAllowedSubscriptions" }}{{ input "azureAllowedSubscriptions" | toJson }}{{ else }}['{{ .ryvn.env.state.subscription.subscription_id }}']{{ end }}
        load_balancer_name: kubernetes-internal
        kubernetes_service:
          cluster_id: '{{ .ryvn.env.state.cluster.id }}'
          namespace: ryvn-system
          name: internal-ryvn-istio
      releaseChannel: stable
  distribution: marketplace-managed
